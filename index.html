<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小老闆文創市集助手</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- html2canvas for JPG export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        html {
            font-size: 16px;
        }
        @media (max-width: 480px) {
            html {
                font-size: 17px;
            }
        }
        body {
            font-family: 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            background-color: #0F172A;
        }
        .app-container {
            height: 100vh;
            height: 100dvh;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 999px;
        }
        .bounce-active:active {
            transform: scale(0.95);
        }
        .pop-in {
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 隱藏滾動條但保留滾動功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 擬真熱敏紙質感與字體 */
        .font-receipt {
            font-family: 'Courier Prime', 'Courier New', monospace;
        }
        .paper-warm {
            background-color: #FFFDF7;
            background-image: radial-gradient(#E2E8F0 0.75px, transparent 0.75px);
            background-size: 8px 8px;
            color: #1E293B;
        }
        .paper-pure {
            background-color: #FFFFFF;
            color: #0F172A;
        }

        /* 熱敏金屬切紙刀口齒痕視覺 */
        .cutter-blade-teeth {
            background-image: repeating-linear-gradient(90deg, #475569 0px, #475569 3px, #0F172A 3px, #0F172A 6px);
        }

        /* 物理真實吐紙 Keyframes：小票由狹縫內部勻速推出 */
        @keyframes realPhysicalPrintFeed {
            0% {
                transform: translateY(-100%);
                opacity: 0.3;
            }
            3% {
                opacity: 1;
            }
            100% {
                transform: translateY(0%);
                opacity: 1;
            }
        }

        .animate-real-print-feed {
            animation-name: realPhysicalPrintFeed;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }

        .receipt-tear-edge {
            background: linear-gradient(-135deg, #FFFDF7 6px, transparent 0), linear-gradient(135deg, #FFFDF7 6px, transparent 0);
            background-size: 12px 12px;
            background-repeat: repeat-x;
        }
        .receipt-tear-edge-pure {
            background: linear-gradient(-135deg, #FFFFFF 6px, transparent 0), linear-gradient(135deg, #FFFFFF 6px, transparent 0);
            background-size: 12px 12px;
            background-repeat: repeat-x;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 antialiased selection:bg-amber-200">
    <div id="root"></div>

    <script type="text/babel">
        const DEFAULT_PRODUCTS = [
            { id: 'p1', name: '手作黏土公仔', price: 30, stock: 10, icon: '🎨' },
            { id: 'p2', name: '手繪插畫明信片', price: 15, stock: 25, icon: '🖼️' },
            { id: 'p3', name: '羊毛氈鑰匙圈', price: 45, stock: 8, icon: '🔑' },
            { id: 'p4', name: '繽紛串珠手鍊', price: 20, stock: 15, icon: '📿' },
            { id: 'p5', name: '文創可愛貼紙包', price: 10, stock: 30, icon: '🏷️' },
        ];

        const DEFAULT_PAYMENTS = [
            { id: 'pay_mpay', name: 'MPay 澳門通', icon: 'fa-mobile-screen-button', qr: '' },
            { id: 'pay_fps', name: '轉數快 / 聚易用', icon: 'fa-qrcode', qr: '' },
            { id: 'pay_wx', name: '微信支付', icon: 'fa-weixin', qr: '' },
            { id: 'pay_ali', name: '支付寶', icon: 'fa-alipay', qr: '' }
        ];

        const DEFAULT_PRINTER_SETTINGS = {
            stallNo: '攤位 A-08',
            slogan: '純手工打造，帶走一份小幸運',
            socialAccount: '@kids_market',
            socialQrImage: '',
            thanksMsg: '感謝支持小老闆的手作夢想！🎉',
            paperTheme: 'warm', // 'warm' or 'pure'
            showSignature: true,
            showSocialQr: true,
            paperWidth: '58mm', // '58mm' or '80mm'
        };

        function App() {
            const [shopName, setShopName] = React.useState(() => {
                return localStorage.getItem('market_shop_name') || '小老闆文創市集助手';
            });

            const [products, setProducts] = React.useState(() => {
                const saved = localStorage.getItem('market_products');
                return saved ? JSON.parse(saved) : DEFAULT_PRODUCTS;
            });

            const [paymentMethods, setPaymentMethods] = React.useState(() => {
                const saved = localStorage.getItem('market_payments');
                return saved ? JSON.parse(saved) : DEFAULT_PAYMENTS;
            });

            const [printerSettings, setPrinterSettings] = React.useState(() => {
                const saved = localStorage.getItem('market_printer_settings');
                return saved ? JSON.parse(saved) : DEFAULT_PRINTER_SETTINGS;
            });

            const [salesHistory, setSalesHistory] = React.useState(() => {
                const saved = localStorage.getItem('market_sales');
                return saved ? JSON.parse(saved) : [];
            });

            const [dailyGoal, setDailyGoal] = React.useState(() => {
                const saved = localStorage.getItem('market_daily_goal');
                return saved ? Number(saved) : 500;
            });

            const [printSpeed, setPrintSpeed] = React.useState(() => {
                return localStorage.getItem('market_print_speed') || '4.5';
            });

            const [activeTab, setActiveTab] = React.useState('pos');
            const [cart, setCart] = React.useState([]);
            const [checkoutModal, setCheckoutModal] = React.useState(false);
            const [payMethod, setPayMethod] = React.useState('cash');
            const [cashReceived, setCashReceived] = React.useState('');
            const [discount, setDiscount] = React.useState(0);
            const [editProductModal, setEditProductModal] = React.useState(null);
            const [showSuccessModal, setShowSuccessModal] = React.useState(false);
            const [lastTransaction, setLastTransaction] = React.useState(null);
            const [receiptModal, setReceiptModal] = React.useState(false);
            const [selectedTxForReceipt, setSelectedTxForReceipt] = React.useState(null);

            // 安全寫入 localStorage
            const safeSetStorage = (key, val) => {
                try {
                    localStorage.setItem(key, typeof val === 'string' ? val : JSON.stringify(val));
                } catch (e) {
                    console.warn(`localStorage quota warning for ${key}:`, e);
                }
            };

            React.useEffect(() => { safeSetStorage('market_shop_name', shopName); }, [shopName]);
            React.useEffect(() => { safeSetStorage('market_products', products); }, [products]);
            React.useEffect(() => { safeSetStorage('market_payments', paymentMethods); }, [paymentMethods]);
            React.useEffect(() => { safeSetStorage('market_printer_settings', printerSettings); }, [printerSettings]);
            React.useEffect(() => { safeSetStorage('market_sales', salesHistory); }, [salesHistory]);
            React.useEffect(() => { safeSetStorage('market_daily_goal', dailyGoal.toString()); }, [dailyGoal]);
            React.useEffect(() => { safeSetStorage('market_print_speed', printSpeed); }, [printSpeed]);

            const cartTotal = cart.reduce((sum, item) => sum + (item.product.price * item.qty), 0);
            const cartItemCount = cart.reduce((sum, item) => sum + item.qty, 0);

            const exportSalesCSV = () => {
                if (salesHistory.length === 0) return;
                let csvContent = "\uFEFF交易單號,交易時間,商品名稱,單價,數量,小計,原價總額,折扣金額,實收總額,支付方式,顧客付額,找零\n";
                salesHistory.forEach(tx => {
                    const timeStr = new Date(tx.timestamp).toLocaleString();
                    const seqStr = tx.seqNo || tx.id;
                    tx.items.forEach(item => {
                        csvContent += [
                            `"${seqStr}"`, `"${timeStr}"`, `"${item.name}"`,
                            item.price, item.qty, item.price * item.qty,
                            tx.subtotal || tx.totalAmount, tx.discountAmount || 0,
                            tx.totalAmount, `"${tx.paymentName}"`, tx.cashReceived, tx.change
                        ].join(",") + "\n";
                    });
                });
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `${shopName}_營業報表_${new Date().toISOString().slice(0,10)}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const exportJSONBackup = () => {
                const backupData = {
                    version: '1.0', exportDate: new Date().toISOString(),
                    shopName, products, paymentMethods, printerSettings, salesHistory, dailyGoal, printSpeed
                };
                const jsonStr = JSON.stringify(backupData, null, 2);
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `${shopName}_全站資料備份_${new Date().toISOString().slice(0,10)}.json`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const importJSONBackup = (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.shopName) setShopName(data.shopName);
                        if (Array.isArray(data.products)) setProducts(data.products);
                        if (Array.isArray(data.paymentMethods)) setPaymentMethods(data.paymentMethods);
                        if (data.printerSettings) setPrinterSettings(data.printerSettings);
                        if (Array.isArray(data.salesHistory)) setSalesHistory(data.salesHistory);
                        if (data.dailyGoal) setDailyGoal(Number(data.dailyGoal));
                        if (data.printSpeed) setPrintSpeed(data.printSpeed);
                        alert('🎉 成功匯入全站備份資料！');
                    } catch (err) {
                        alert('⚠️ 匯入失敗：檔案格式不正確！');
                    }
                };
                reader.readAsText(file);
            };

            const handleVoidTransaction = (txId) => {
                const targetTx = salesHistory.find(t => t.id === txId);
                if (!targetTx) return;

                setProducts(prevProducts => {
                    return prevProducts.map(p => {
                        const itemInTx = targetTx.items.find(i => i.id === p.id);
                        return itemInTx ? { ...p, stock: p.stock + itemInTx.qty } : p;
                    });
                });
                setSalesHistory(prev => prev.filter(t => t.id !== txId));
            };

            const addToCart = (product) => {
                if (product.stock <= 0) return;
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    const currentQty = existing ? existing.qty : 0;
                    if (currentQty >= product.stock) return prev;
                    return existing 
                        ? prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item)
                        : [...prev, { id: product.id, product, qty: 1 }];
                });
            };

            const updateCartQty = (id, delta) => {
                setCart(prev => {
                    return prev.map(item => {
                        if (item.id === id) {
                            const newQty = item.qty + delta;
                            const product = products.find(p => p.id === id);
                            if (newQty <= 0) return null;
                            if (product && newQty > product.stock) return item;
                            return { ...item, qty: newQty };
                        }
                        return item;
                    }).filter(Boolean);
                });
            };

            const clearCart = () => setCart([]);

            const handleCompleteCheckout = () => {
                if (cart.length === 0) return;
                try { confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } }); } catch(e) {}

                const updatedProducts = products.map(p => {
                    const cartItem = cart.find(ci => ci.id === p.id);
                    return cartItem ? { ...p, stock: Math.max(0, p.stock - cartItem.qty) } : p;
                });

                const finalPayable = Math.max(0, cartTotal - discount);
                const nextSeqNum = salesHistory.length + 1;
                const seqNoStr = `#${String(nextSeqNum).padStart(4, '0')}`;

                const transaction = {
                    id: 'tx_' + Date.now(),
                    seqNo: seqNoStr,
                    timestamp: new Date().toISOString(),
                    items: cart.map(item => ({
                        id: item.product.id,
                        name: item.product.name,
                        price: item.product.price,
                        qty: item.qty
                    })),
                    subtotal: cartTotal,
                    discountAmount: discount,
                    totalAmount: finalPayable,
                    paymentMethod: payMethod,
                    paymentName: payMethod === 'cash' ? '現金' : (paymentMethods.find(m => m.id === payMethod)?.name || '電子支付'),
                    cashReceived: payMethod === 'cash' ? (parseFloat(cashReceived) || finalPayable) : finalPayable,
                    change: payMethod === 'cash' ? Math.max(0, (parseFloat(cashReceived) || finalPayable) - finalPayable) : 0
                };

                setProducts(updatedProducts);
                setSalesHistory(prev => [transaction, ...prev]);
                setLastTransaction(transaction);
                setCart([]);
                setDiscount(0);
                setCheckoutModal(false);
                setCashReceived('');
                setShowSuccessModal(true);
            };

            return (
                <div className="flex flex-col app-container w-full max-w-lg mx-auto bg-white shadow-2xl relative overflow-hidden border-x border-slate-200">
                    <header className="bg-gradient-to-r from-amber-400 via-orange-400 to-rose-400 p-4 text-white shadow-md flex justify-between items-center z-10 shrink-0">
                        <div className="flex items-center space-x-2.5">
                            <span className="text-3xl bg-white/20 p-2 rounded-2xl backdrop-blur-sm">🏬</span>
                            <div>
                                <h1 className="font-black text-xl leading-tight tracking-wide truncate max-w-[170px] sm:max-w-[210px]">{shopName}</h1>
                                <p className="text-xs text-amber-100 font-bold">簡單收銀 • 庫存管理 • 統計</p>
                            </div>
                        </div>
                        <div className="bg-white/20 backdrop-blur-md px-3 py-2 rounded-2xl text-xs font-bold border border-white/30 flex flex-col items-end">
                            <span className="text-[11px] text-amber-100">🪙 總營業額</span>
                            <span className="text-yellow-100 text-base font-extrabold">
                                ${salesHistory.reduce((s, t) => s + t.totalAmount, 0)}
                            </span>
                        </div>
                    </header>

                    <main className="flex-1 overflow-y-auto bg-slate-50 relative pb-24">
                        {activeTab === 'pos' && (
                            <PosView 
                                products={products} cart={cart} addToCart={addToCart} updateCartQty={updateCartQty}
                                clearCart={clearCart} cartTotal={cartTotal} cartItemCount={cartItemCount}
                                openCheckout={() => setCheckoutModal(true)}
                            />
                        )}
                        {activeTab === 'inventory' && (
                            <InventoryView 
                                products={products} setProducts={setProducts} openEditModal={(p) => setEditProductModal(p)}
                            />
                        )}
                        {activeTab === 'stats' && (
                            <StatsView 
                                salesHistory={salesHistory} products={products} dailyGoal={dailyGoal}
                                setDailyGoal={setDailyGoal} voidTransaction={handleVoidTransaction}
                                openReceiptModal={(tx = null) => { setSelectedTxForReceipt(tx); setReceiptModal(true); }}
                                exportCSV={exportSalesCSV} clearHistory={() => setSalesHistory([])}
                            />
                        )}
                        {activeTab === 'settings' && (
                            <SettingsView 
                                shopName={shopName} setShopName={setShopName}
                                paymentMethods={paymentMethods} setPaymentMethods={setPaymentMethods}
                                printerSettings={printerSettings} setPrinterSettings={setPrinterSettings}
                                printSpeed={printSpeed} setPrintSpeed={setPrintSpeed}
                                exportBackup={exportJSONBackup} importBackup={importJSONBackup}
                                resetDemoData={() => {
                                    setProducts(DEFAULT_PRODUCTS); setPaymentMethods(DEFAULT_PAYMENTS);
                                    setPrinterSettings(DEFAULT_PRINTER_SETTINGS); setSalesHistory([]);
                                    setDailyGoal(500); setShopName('小老闆文創市集助手'); setPrintSpeed('4.5');
                                    localStorage.clear();
                                }}
                            />
                        )}
                    </main>

                    <nav className="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-2 py-2 flex justify-around items-center z-10 shadow-lg">
                        <NavButton active={activeTab === 'pos'} onClick={() => setActiveTab('pos')} icon="fa-cash-register" label="收銀台" badge={cartItemCount} />
                        <NavButton active={activeTab === 'inventory'} onClick={() => setActiveTab('inventory')} icon="fa-boxes-stacked" label="庫存/商品" />
                        <NavButton active={activeTab === 'stats'} onClick={() => setActiveTab('stats')} icon="fa-chart-pie" label="營業統計" />
                        <NavButton active={activeTab === 'settings'} onClick={() => setActiveTab('settings')} icon="fa-sliders" label="系統設定" />
                    </nav>

                    {receiptModal && (
                        <ReceiptModal 
                            shopName={shopName} salesHistory={salesHistory} transaction={selectedTxForReceipt}
                            printerSettings={printerSettings} printSpeed={printSpeed}
                            onClose={() => { setReceiptModal(false); setSelectedTxForReceipt(null); }}
                        />
                    )}
                    {checkoutModal && (
                        <CheckoutModal 
                            cart={cart} cartTotal={cartTotal} discount={discount} setDiscount={setDiscount}
                            paymentMethods={paymentMethods} payMethod={payMethod} setPayMethod={setPayMethod}
                            cashReceived={cashReceived} setCashReceived={setCashReceived}
                            onClose={() => { setCheckoutModal(false); setDiscount(0); }} onConfirm={handleCompleteCheckout}
                        />
                    )}
                    {showSuccessModal && lastTransaction && (
                        <SuccessModal 
                            transaction={lastTransaction} onClose={() => setShowSuccessModal(false)}
                            onOpenReceipt={(tx) => { setSelectedTxForReceipt(tx); setReceiptModal(true); }}
                        />
                    )}
                    {editProductModal && (
                        <EditProductModal 
                            product={editProductModal === 'new' ? null : editProductModal}
                            onClose={() => setEditProductModal(null)}
                            onSave={(savedProduct) => {
                                if (editProductModal === 'new') {
                                    setProducts([...products, { ...savedProduct, id: 'p_' + Date.now() }]);
                                } else {
                                    setProducts(products.map(p => p.id === savedProduct.id ? savedProduct : p));
                                }
                                setEditProductModal(null);
                            }}
                            onDelete={(id) => {
                                setProducts(products.filter(p => p.id !== id));
                                setEditProductModal(null);
                            }}
                        />
                    )}
                </div>
            );
        }

        function PosView({ products, cart, addToCart, updateCartQty, clearCart, cartTotal, cartItemCount, openCheckout }) {
            const [searchQuery, setSearchQuery] = React.useState('');
            const filteredProducts = products.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase().trim()));
            const lowStockCount = products.filter(p => p.stock > 0 && p.stock <= 3).length;

            return (
                <div className="p-3 space-y-3">
                    <div className="space-y-2">
                        <div className="relative">
                            <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-xs"></i>
                            <input 
                                type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)}
                                placeholder="搜尋商品名稱..."
                                className="w-full bg-white border border-slate-200 rounded-2xl pl-9 pr-8 py-2 text-xs font-bold text-slate-800 outline-none focus:border-amber-400 shadow-sm"
                            />
                            {searchQuery && (
                                <button onClick={() => setSearchQuery('')} className="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 text-xs">
                                    <i className="fa-solid fa-xmark"></i>
                                </button>
                            )}
                        </div>
                        {lowStockCount > 0 && (
                            <div className="bg-rose-50 border border-rose-200 text-rose-700 px-3 py-1.5 rounded-xl text-[11px] font-bold flex items-center justify-between">
                                <span className="flex items-center gap-1.5">
                                    <i className="fa-solid fa-triangle-exclamation text-rose-500 animate-pulse"></i>
                                    <span>有 {lowStockCount} 項商品庫存小於 3 件，記得補貨喔！</span>
                                </span>
                            </div>
                        )}
                    </div>

                    <div>
                        <div className="flex justify-between items-center mb-2 px-1">
                            <h2 className="text-sm font-black text-slate-700 flex items-center gap-1.5">
                                <i className="fa-solid fa-store text-amber-500"></i>
                                點擊商品加入購物車
                            </h2>
                            <span className="text-xs text-slate-400 font-bold">共 {filteredProducts.length} 項</span>
                        </div>
                        {filteredProducts.length === 0 ? (
                            <div className="bg-white p-8 rounded-2xl text-center border border-slate-200 text-slate-400 space-y-2">
                                <i className="fa-solid fa-box-open text-3xl text-slate-300"></i>
                                <p className="text-xs font-bold">找不到相符的商品喔！</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                                {filteredProducts.map(product => {
                                    const isOut = product.stock <= 0;
                                    const isLow = product.stock > 0 && product.stock <= 3;
                                    const inCart = cart.find(i => i.id === product.id);
                                    const cartQty = inCart ? inCart.qty : 0;
                                    return (
                                        <button
                                            key={product.id} onClick={() => addToCart(product)} disabled={isOut}
                                            className={`p-3 rounded-2xl border text-left relative flex flex-col justify-between transition-all active:scale-95 shadow-sm ${
                                                isOut ? 'bg-slate-100 border-slate-200 opacity-60 cursor-not-allowed' :
                                                isLow ? 'bg-white border-rose-300 hover:border-amber-400' : 'bg-white border-slate-200 hover:border-amber-400 hover:shadow-md'
                                            }`}
                                        >
                                            {cartQty > 0 && (
                                                <span className="absolute -top-2 -right-2 bg-rose-500 text-white font-black text-xs px-2 py-0.5 rounded-full shadow-md z-10 animate-bounce">
                                                    +{cartQty}
                                                </span>
                                            )}
                                            <div className="flex items-center justify-center h-20 mb-2 rounded-xl bg-slate-50 relative overflow-hidden">
                                                {product.image ? (

            const totalRevenue = isSingle ? transaction.totalAmount : salesHistory.reduce((s, t) => s + t.totalAmount, 0);
            const totalItemsSold = isSingle 
                ? transaction.items.reduce((s, i) => s + i.qty, 0)
                : salesHistory.reduce((s, t) => s + t.items.reduce((is, i) => is + i.qty, 0), 0);
            
            const cashRevenue = salesHistory.filter(t => t.paymentMethod === 'cash').reduce((s, t) => s + t.totalAmount, 0);
            const epayRevenue = totalRevenue - cashRevenue;

            const [animKey] = React.useState(0);
            const [isPrinting, setIsPrinting] = React.useState(false);
            const [printProgress, setPrintProgress] = React.useState(100);
            const [isSharing, setIsSharing] = React.useState(false);

            React.useEffect(() => {
                const duration = parseFloat(printSpeed);
                if (duration <= 0) {
                    setIsPrinting(false);
                    setPrintProgress(100);
                    return;
                }

                setIsPrinting(true);
                setPrintProgress(0);

                const startTime = Date.now();
                const totalMs = duration * 1000;

                const timer = setInterval(() => {
                    const elapsed = Date.now() - startTime;
                    const pct = Math.min(100, Math.floor((elapsed / totalMs) * 100));
                    setPrintProgress(pct);

                    if (elapsed >= totalMs) {
                        clearInterval(timer);
                        setIsPrinting(false);
                        setPrintProgress(100);
                    }
                }, 50);

                return () => clearInterval(timer);
            }, [animKey, printSpeed]);

            const itemSummary = {};
            if (isSingle) {
                transaction.items.forEach(item => {
                    itemSummary[item.name] = { qty: item.qty, subtotal: item.price * item.qty, price: item.price };
                });
            } else {
                salesHistory.forEach(t => {
                    t.items.forEach(item => {
                        if (!itemSummary[item.name]) {
                            itemSummary[item.name] = { qty: 0, subtotal: 0, price: item.price };
                        }
                        itemSummary[item.name].qty += item.qty;
                        itemSummary[item.name].subtotal += (item.price * item.qty);
                    });
                });
            }

            const downloadJPG = () => {
                const element = document.getElementById('printable-receipt');
                if (!element) return;

                html2canvas(element, {
                    scale: 3,
                    useCORS: true,
                    backgroundColor: printerSettings.paperTheme === 'pure' ? '#FFFFFF' : '#FFFDF7'
                }).then(canvas => {
                    const link = document.createElement('a');
                    const filePrefix = isSingle ? `單筆交易明細_${(transaction.seqNo || transaction.id).replace('#', '')}` : '營業統計小票';
                    link.download = `${shopName}_${filePrefix}_${new Date().toISOString().slice(0, 10)}.jpg`;
                    link.href = canvas.toDataURL('image/jpeg', 0.92);
                    link.click();
                });
            };

            const handleSharePrint = () => {
                const element = document.getElementById('printable-receipt');
                if (!element) return;
                setIsSharing(true);

                html2canvas(element, {
                    scale: 3,
                    useCORS: true,
                    backgroundColor: printerSettings.paperTheme === 'pure' ? '#FFFFFF' : '#FFFDF7'
                }).then(canvas => {
                    canvas.toBlob((blob) => {
                        if (!blob) {
                            setIsSharing(false);
                            downloadJPG();
                            return;
                        }

                        const fileName = `${shopName}_小票_${Date.now()}.jpg`;
                        const file = new File([blob], fileName, { type: 'image/jpeg' });

                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            navigator.share({
                                files: [file],
                                title: `${shopName} 小票列印`,
                                text: '請選擇熱敏印表機 APP 或 RawBT 進行列印'
                            }).then(() => {
                                setIsSharing(false);
                            }).catch((err) => {
                                console.warn('Share cancelled or error:', err);
                                setIsSharing(false);
                            });
                        } else {
                            setIsSharing(false);
                            downloadJPG();
                        }
                    }, 'image/jpeg', 0.92);
                }).catch(err => {
                    console.error(err);
                    setIsSharing(false);
                });
            };

            const is80mm = printerSettings.paperWidth === '80mm';

            return (
                <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-3 z-50 pop-in overflow-y-auto">

                                <div className="relative z-30">

                                <div 
                                    key={animKey}
                                    className="animate-real-print-feed transition-all w-full"
                                    style={parseFloat(printSpeed) > 0 ? { animationDuration: `${printSpeed}s` } : { animation: 'none' }}

                                    <div

                                        className={`font-receipt p-4 text-slate-800 shadow-[0_12px_28px_rgba(0,0,0,0.6)] space-y-3 relative rounded-t-sm mx-auto transition-all ${

                                    >
                                        <div className="text-center space-y-1 pb-2 border-b-2 border-slate-800">
                                            <h2 className="text-base font-black tracking-wider leading-snug">{shopName}</h2>
                                            {printerSettings.stallNo && (

                                        </div>

                                        {isSingle ? (

                                                    <span className="text-sm font-black">${transaction.totalAmount}</span>
                                                </div>
                                                {transaction.paymentMethod === 'cash' && (
                                                    <div className="flex justify-between text-[10px] text-slate-600">
                                                        <span>給付 / 找零：</span>
                                                        <span>${transaction.cashReceived} / ${transaction.change}</span>
                                                    </div>
                                                )}
                                            </div>
                                        ) : (
                                            <div className="space-y-1 py-1 border-b border-dashed border-slate-400 font-mono">
                                                <div className="flex justify-between font-bold">
                                                    <span>今日總營業額：</span>
                                                    <span className="text-sm font-black">${totalRevenue}</span>
                                                </div>
                                                <div className="flex justify-between text-slate-600 text-[11px]">
                                                    <span>總筆數 / 件數：</span>
                                                    <span>{salesHistory.length} 筆 / {totalItemsSold} 件</span>
                                                </div>
                                                <div className="flex justify-between text-slate-600 text-[11px]">
                                                    <span>💵 現金收入：</span>
                                                    <span>${cashRevenue}</span>
                                                </div>
                                                <div className="flex justify-between text-slate-600 text-[11px]">
                                                    <span>📱 電子支付：</span>
                                                    <span>${epayRevenue}</span>
                                                </div>
                                            </div>
                                        )}

                                        <div className="space-y-1.5 py-1">
                                            <div className="font-black text-[11px] pb-1 border-b border-slate-300 flex justify-between">
                                                <span>商品項目</span>
                                                <span>數量 x 單價 = 小計</span>
                                            </div>
                                            {Object.keys(itemSummary).length === 0 ? (
                                                <p className="text-center py-2 text-slate-400">尚無商品項目</p>
                                            ) : (
                                                Object.entries(itemSummary).map(([name, stat]) => (
                                                    <div key={name} className="flex justify-between text-[11px] font-mono">
                                                        <span className="font-bold truncate max-w-[120px]">{name}</span>
                                                        <span>{stat.qty} x ${stat.price} = <strong>${stat.subtotal}</strong></span>
                                                    </div>
                                                ))
                                            )}
                                        </div>

                                        <div className="pt-3 border-t-2 border-slate-800 text-center space-y-2">
                                            <p className="text-[10px] font-bold">{printerSettings.thanksMsg || '感謝支持小老闆的手作夢想！🎉'}</p>
                                            {printerSettings.showSocialQr && (
                                                <div className="pt-1 flex flex-col items-center justify-center">
                                                    {printerSettings.socialQrImage ? (
                                                        <img src={printerSettings.socialQrImage} alt="社群 QR Code" className="w-20 h-20 object-contain p-1 border border-slate-300 rounded bg-white shadow-sm" />
                                                    ) : (
                                                        <div className="w-16 h-16 bg-slate-900 p-1 rounded flex items-center justify-center">
                                                            <div className="w-full h-full border border-white flex flex-col justify-between p-0.5">
                                                                <div className="flex justify-between"><div className="w-2.5 h-2.5 bg-white"></div><div className="w-2.5 h-2.5 bg-white"></div></div>
                                                                <div className="text-[6px] text-white font-mono text-center">IG SCAN</div>
                                                                <div className="flex justify-between"><div className="w-2.5 h-2.5 bg-white"></div><div className="w-1.5 h-1.5 bg-white"></div></div>
                                                            </div>
                                                        </div>
                                                    )}
                                                    {printerSettings.socialAccount && (
                                                        <span className="text-[9px] text-slate-600 font-mono mt-1 font-bold">追蹤我們：{printerSettings.socialAccount}</span>
                                                    )}
                                                </div>
                                            )}
                                            {printerSettings.showSignature && (
                                                <div className="pt-2 flex justify-between items-end text-[10px] text-slate-500 font-sans">
                                                    <span>小老闆簽名：___________</span>
                                                    <span>小助手核對：___________</span>
                                                </div>
                                            )}
                                        </div>

                                        <div className={`absolute -bottom-2 left-0 right-0 h-2 ${printerSettings.paperTheme === 'pure' ? 'receipt-tear-edge-pure' : 'receipt-tear-edge'}`}></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="pt-1 grid grid-cols-2 gap-2">
                            <button 
                                onClick={handleSharePrint}
                                disabled={isSharing}
                                className="bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-slate-950 font-black py-3 rounded-2xl text-xs flex items-center justify-center gap-1.5 shadow-lg active:scale-95 transition-all disabled:opacity-50"
                            >
                                <i className="fa-solid fa-print text-sm"></i>
                                <span>{isSharing ? '處理中...' : '🖨️ 藍牙/手機列印'}</span>
                            </button>
                            <button 
                                onClick={downloadJPG}
                                className="bg-slate-800 hover:bg-slate-700 text-white font-extrabold py-3 rounded-2xl text-xs flex items-center justify-center gap-1.5 border border-slate-700 bounce-active shadow-lg"
                            >
                                <i className="fa-solid fa-image text-sky-400 text-sm"></i>
                                <span>下載 JPG 圖片</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function CheckoutModal({ cart, cartTotal, discount, setDiscount, paymentMethods, payMethod, setPayMethod, cashReceived, setCashReceived, onClose, onConfirm }) {
            const finalPayable = Math.max(0, cartTotal - discount);
            const numCash = parseFloat(cashReceived) || 0;
            const change = Math.max(0, numCash - finalPayable);
            const selectedPayObj = paymentMethods.find(m => m.id === payMethod);
            const quickBills = [10, 20, 50, 100, 500];

            return (
                <div className="fixed inset-0 bg-slate-900/75 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 z-50 pop-in">
                    <div className="bg-white w-full max-w-md rounded-3xl p-4 sm:p-5 shadow-2xl space-y-3.5 max-h-[96vh] flex flex-col justify-between overflow-hidden border border-slate-100">
                        {/* 頂部標題與關閉 */}
                        <div className="flex justify-between items-center border-b border-slate-100 pb-2.5 shrink-0">
                            <h3 className="font-black text-base sm:text-lg text-slate-800 flex items-center gap-2">
                                <i className="fa-solid fa-cash-register text-amber-500 text-lg"></i>
                                顧客結帳與付款
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 p-1 rounded-full hover:bg-slate-100 transition-colors">
                                <i className="fa-solid fa-xmark text-xl"></i>
                            </button>
                        </div>

                        {/* 實收金額與促銷折扣區 */}
                        <div className="bg-slate-900 text-white p-3.5 sm:p-4 rounded-2xl shadow-md space-y-3 shrink-0">
                            <div className="flex justify-between items-center border-b border-slate-800 pb-2.5">
                                <span className="text-xs sm:text-sm font-bold text-slate-300">結帳實收金額</span>
                                <div className="flex items-baseline space-x-2">
                                    <span className="text-3xl sm:text-4xl font-black text-amber-400 font-mono">${finalPayable}</span>
                                    {discount > 0 && (
                                        <span className="text-xs line-through text-slate-400 font-mono">原價 ${cartTotal}</span>
                                    )}
                                </div>
                            </div>

                            {/* 折扣選擇列 */}
                            <div className="space-y-1.5">
                                <span className="text-xs text-slate-300 font-bold block">促銷折扣：</span>
                                <div className="grid grid-cols-5 gap-1.5">
                                    {[
                                        { label: '無折扣', val: 0 },
                                        { label: '-$5', val: 5 },
                                        { label: '-$10', val: 10 },
                                        { label: '9折', val: Math.round(cartTotal * 0.1) },
                                        { label: '85折', val: Math.round(cartTotal * 0.15) }
                                    ].map(opt => (
                                        <button
                                            key={opt.label} type="button" onClick={() => setDiscount(opt.val)}
                                            className={`py-2 rounded-xl font-extrabold text-xs transition-all text-center ${
                                                discount === opt.val ? 'bg-rose-500 text-white shadow-md scale-105' : 'bg-slate-800 text-slate-200 hover:bg-slate-700'
                                            }`}
                                        >
                                            {opt.label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* 付款方式切換區 */}
                        <div className="space-y-1.5 shrink-0">
                            <label className="text-xs font-bold text-slate-600 block">選擇付款方式：</label>
                            <div className="grid grid-cols-3 gap-1.5">
                                <button 
                                    onClick={() => setPayMethod('cash')}
                                    className={`py-2.5 px-3 rounded-2xl border font-black text-xs sm:text-sm flex items-center justify-center space-x-1.5 transition-all ${
                                        payMethod === 'cash' ? 'bg-amber-100 border-amber-400 text-amber-950 shadow-md ring-2 ring-amber-400/30' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'
                                    }`}
                                >
                                    <i className="fa-solid fa-money-bill-wave text-emerald-600 text-sm"></i>
                                    <span>現金</span>
                                </button>
                                {paymentMethods.map(m => (
                                    <button 
                                        key={m.id} onClick={() => setPayMethod(m.id)}
                                        className={`py-2.5 px-2 rounded-2xl border font-black text-xs sm:text-sm flex items-center justify-center space-x-1.5 transition-all ${
                                            payMethod === m.id ? 'bg-sky-100 border-sky-400 text-sky-950 shadow-md ring-2 ring-sky-400/30' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'
                                        }`}
                                    >
                                        <i className={`fa-solid ${m.icon} text-sm`}></i>
                                        <span className="truncate">{m.name.split(' ')[0]}</span>
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* 現金算鈔 / 電子支付 QR 展示區 */}
                        <div className="flex-1 overflow-y-auto no-scrollbar py-1">
                            {payMethod === 'cash' ? (
                                <div className="space-y-3 bg-slate-50 p-3 rounded-2xl border border-slate-200">
                                    <div className="flex items-center gap-2">
                                        <div className="flex-1 relative">
                                            <span className="absolute left-3 top-2 text-slate-400 font-black text-base">$</span>
                                            <input 
                                                type="number" value={cashReceived} onChange={(e) => setCashReceived(e.target.value)}
                                                placeholder={finalPayable.toString()}
                                                className="w-full pl-7 pr-3 py-2 border rounded-xl font-black text-lg outline-none focus:border-amber-400 bg-white shadow-inner font-mono text-slate-800"
                                            />
                                        </div>
                                        <button 
                                            onClick={() => setCashReceived(finalPayable.toString())} 
                                            className="bg-amber-200 hover:bg-amber-300 text-amber-950 font-black px-3 py-2.5 rounded-xl text-xs shrink-0 shadow-sm bounce-active"
                                        >
                                            剛好 ${finalPayable}
                                        </button>
                                    </div>

                                    <div className="flex flex-wrap gap-1.5">
                                        {quickBills.map(b => (
                                            <button 
                                                key={b} onClick={() => setCashReceived(b.toString())}
                                                className="bg-white border border-slate-200 text-slate-700 font-black px-3 py-1.5 rounded-xl text-xs hover:bg-slate-100 shadow-sm font-mono active:scale-95 transition-all"
                                            >
                                                ${b}
                                            </button>
                                        ))}
                                    </div>

                                    <div className="bg-white px-3 py-2.5 rounded-xl border border-slate-200 flex justify-between items-center shadow-sm">
                                        <span className="text-xs sm:text-sm font-extrabold text-slate-600">應找金額：</span>
                                        <span className={`text-xl sm:text-2xl font-black font-mono ${change < 0 ? 'text-rose-500' : 'text-emerald-600'}`}>
                                            ${numCash >= finalPayable ? change : 0}
                                        </span>
                                    </div>
                                </div>
                            ) : (
                                <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200 text-center space-y-2">
                                    <p className="font-extrabold text-xs sm:text-sm text-slate-700">
                                        請展示 {selectedPayObj?.name} QR Code 給顧客掃碼
                                    </p>
                                    {selectedPayObj?.qr ? (
                                        <div className="bg-white p-2 rounded-2xl shadow-sm inline-block border border-slate-200">
                                            <img src={selectedPayObj.qr} alt={selectedPayObj.name} className="w-32 h-32 sm:w-36 sm:h-36 object-contain mx-auto" />
                                        </div>
                                    ) : (
                                        <div className="bg-amber-50 border border-amber-200 p-3 rounded-xl text-amber-800 text-xs font-bold">
                                            <p>尚未設定 {selectedPayObj?.name} 的收款 QR Code 圖片。</p>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        {/* 底部固定完成按鈕 */}
                        <button 
                            onClick={onConfirm}
                            className="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black py-3.5 sm:py-4 rounded-2xl text-sm sm:text-base shadow-lg bounce-active flex items-center justify-center space-x-2 shrink-0 tracking-wider"
                        >
                            <i className="fa-solid fa-check text-lg"></i>
                            <span>完成交易扣減庫存</span>
                        </button>
                    </div>
                </div>
            );
        }

        function SuccessModal({ transaction, onClose, onOpenReceipt }) {
            return (
                <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 pop-in">
                    <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center space-y-4">
                        <div className="w-16 h-16 bg-emerald-100 text-emerald-500 rounded-full flex items-center justify-center text-3xl mx-auto animate-bounce">
                            🎉
                        </div>
                        <div>
                            <h3 className="text-lg font-black text-slate-800">交易成功！銷售完成</h3>
                            <p className="text-xs text-slate-400 mt-1">單號：{transaction.seqNo} • 已自動更新商品庫存</p>
                        </div>

                        <div className="bg-slate-50 p-3 rounded-2xl text-xs font-bold text-slate-700 border space-y-1">
                            <div className="flex justify-between">
                                <span>實收金額：</span>
                                <span className="text-amber-600 font-black">${transaction.totalAmount}</span>
                            </div>
                            <div className="flex justify-between text-slate-500 text-[11px]">
                                <span>付款方式：</span>
                                <span>{transaction.paymentName}</span>
                            </div>
                        </div>

                        <div className="space-y-2">
                            <button 
                                onClick={() => { onClose(); onOpenReceipt(transaction); }}
                                className="w-full bg-amber-500 hover:bg-amber-600 text-white font-extrabold py-3 rounded-2xl text-xs shadow-md bounce-active flex items-center justify-center gap-2"
                            >
                                <i className="fa-solid fa-receipt text-sm"></i>
                                <span>列印 / 下載此單小票</span>
                            </button>
                            <button 
                                onClick={onClose}
                                className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-2xl text-xs"
                            >
                                回收銀台繼續販售
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function EditProductModal({ product, onClose, onSave, onDelete }) {
            const [name, setName] = React.useState(product?.name || '');
            const [price, setPrice] = React.useState(product?.price || 10);
            const [stock, setStock] = React.useState(product?.stock || 10);
            const [icon, setIcon] = React.useState(product?.icon || '🎨');
            const [image, setImage] = React.useState(product?.image || '');

            const EMOJI_OPTIONS = ['🎨', '🖼️', '🔑', '📿', '🏷️', '🧸', '🧶', '🪴', '🧦', '🧁', '🍪', '📖'];

            return (
                <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 z-50 pop-in">
                    <div className="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                        <div className="flex justify-between items-center border-b pb-2">
                            <h3 className="font-black text-sm text-slate-800">
                                {product ? '編輯商品資訊' : '新增手作商品'}
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 p-1">
                                <i className="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>

                        <div className="space-y-3 text-xs">
                            <div>
                                <label className="font-bold text-slate-600 block mb-1">商品名稱：</label>
                                <input 
                                    type="text" value={name} onChange={(e) => setName(e.target.value)}
                                    placeholder="例如: 羊毛氈吊飾"
                                    className="w-full border rounded-xl px-3 py-2 font-bold outline-none focus:border-amber-400"
                                />
                            </div>

                            <div className="grid grid-cols-2 gap-2">
                                <div>
                                    <label className="font-bold text-slate-600 block mb-1">單價 ($)：</label>
                                    <input 
                                        type="number" value={price} onChange={(e) => setPrice(Number(e.target.value))}
                                        className="w-full border rounded-xl px-3 py-2 font-bold outline-none focus:border-amber-400"
                                    />
                                </div>
                                <div>
                                    <label className="font-bold text-slate-600 block mb-1">庫存數量：</label>
                                    <input 
                                        type="number" value={stock} onChange={(e) => setStock(Number(e.target.value))}
                                        className="w-full border rounded-xl px-3 py-2 font-bold outline-none focus:border-amber-400"
                                    />
                                </div>
                            </div>

                            <div>
                                <label className="font-bold text-slate-600 block mb-1">選擇 Icon 圖示：</label>
                                <div className="grid grid-cols-6 gap-1 bg-slate-50 p-2 rounded-xl border">
                                    {EMOJI_OPTIONS.map(e => (
                                        <button 
                                            key={e} type="button" onClick={() => { setIcon(e); setImage(''); }}
                                            className={`h-8 text-lg rounded-lg flex items-center justify-center ${
                                                icon === e && !image ? 'bg-amber-200 border border-amber-400' : 'hover:bg-slate-200'
                                            }`}
                                        >
                                            {e}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div>
                                <label className="font-bold text-slate-600 block mb-1">相簿照片上傳：</label>
                                {image ? (
                                    <div className="relative w-20 h-20 rounded-xl overflow-hidden border">
                                        <img src={image} alt="預覽" className="w-full h-full object-cover" />
                                        <button onClick={() => setImage('')} className="absolute top-1 right-1 bg-rose-500 text-white rounded-full w-5 h-5 text-[10px] flex items-center justify-center font-bold">
                                            ✕
                                        </button>
                                    </div>
                                ) : (
                                    <label className="flex items-center justify-center gap-2 p-2.5 border-2 border-dashed border-slate-300 rounded-xl cursor-pointer hover:border-amber-400 text-slate-500 font-bold">
                                        <i className="fa-solid fa-image text-amber-500"></i>
                                        <span>從相簿選擇圖片</span>
                                        <input 
                                            type="file" accept="image/*" className="hidden"
                                            onChange={(e) => {
                                                const file = e.target.files && e.target.files[0];
                                                if (file) {
                                                    const reader = new FileReader();
                                                    reader.onload = (ev) => setImage(ev.target.result);
                                                    reader.readAsDataURL(file);
                                                }
                                            }}
                                        />
                                    </label>
                                )}
                            </div>
                        </div>

                        <div className="flex gap-2 pt-2 border-t">
                            {product && (
                                <button 
                                    onClick={() => onDelete(product.id)}
                                    className="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-3 py-2 rounded-xl text-xs border border-rose-200"
                                >
                                    刪除
                                </button>
                            )}
                            <button 
                                onClick={() => {
                                    if (!name.trim()) return;
                                    onSave({ ...product, name, price, stock, icon, image });
                                }}
                                className="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-black py-2.5 rounded-xl text-xs shadow-md"
                            >
                                儲存商品
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function NavButton({ active, onClick, icon, label, badge }) {
            return (
                <button 
                    onClick={onClick}
                    className={`flex flex-col items-center justify-center py-2 px-3 rounded-2xl transition-all relative min-w-[68px] ${
                        active ? 'text-amber-500 font-black scale-105 bg-amber-50' : 'text-slate-400 font-bold'
                    }`}
                >
                    <i className={`fa-solid ${icon} text-xl mb-1`}></i>
                    <span className="text-xs">{label}</span>
                    {badge > 0 && (
                        <span className="absolute top-1 right-2 bg-rose-500 text-white rounded-full w-5 h-5 text-xs flex items-center justify-center font-black shadow-md border-2 border-white">
                            {badge}
                        </span>
                    )}
                </button>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
