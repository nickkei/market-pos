<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小老闆文創市集助手</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        html {
            font-size: 16px;
        }
        @media (max-width: 480px) {
            html {
                font-size: 17px;
            }
        }
        body {
            font-family: 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            background-color: #F8FAFC;
        }
        .app-container {
            height: 100vh;
            height: 100dvh;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 999px;
        }
        .bounce-active:active {
            transform: scale(0.95);
        }
        .pop-in {
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 專門為熱敏紙小票設計的列印樣式 */
        @media print {
            body * {
                visibility: hidden;
            }
            #printable-receipt, #printable-receipt * {
                visibility: visible;
            }
            #printable-receipt {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 10px;
                box-shadow: none;
                background: white;
            }
            .no-print {
                display: none !important;
            }
        }
        .receipt-paper {
            background-color: #fffefa;
            background-image: radial-gradient(#e2e8f0 1px, transparent 0);
            background-size: 8px 8px;
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-amber-200">
    <div id="root"></div>

    <script type="text/babel">
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (type === 'click') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'add') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.12);
                } else if (type === 'cash') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + (i * 0.06));
                        gain.gain.setValueAtTime(0.25, ctx.currentTime + (i * 0.06));
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (i * 0.06) + 0.25);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + (i * 0.06));
                        osc.stop(ctx.currentTime + (i * 0.06) + 0.25);
                    });
                }
            } catch (e) {
                console.log("Audio not supported or blocked");
            }
        };

        const DEFAULT_PRODUCTS = [
            { id: 'p1', name: '手作黏土公仔', price: 30, stock: 10, icon: '🎨', color: 'bg-rose-100 text-rose-600' },
            { id: 'p2', name: '手繪插畫明信片', price: 15, stock: 25, icon: '🖼️', color: 'bg-amber-100 text-amber-600' },
            { id: 'p3', name: '羊毛氈鑰匙圈', price: 45, stock: 8, icon: '🔑', color: 'bg-emerald-100 text-emerald-600' },
            { id: 'p4', name: '繽紛串珠手鍊', price: 20, stock: 15, icon: '📿', color: 'bg-sky-100 text-sky-600' },
            { id: 'p5', name: '文創可愛貼紙包', price: 10, stock: 30, icon: '🏷️', color: 'bg-purple-100 text-purple-600' },
        ];

        const DEFAULT_PAYMENTS = [
            { id: 'pay_mpay', name: 'MPay 澳門通', icon: 'fa-mobile-screen-button', color: 'bg-red-500 text-white', qr: '' },
            { id: 'pay_fps', name: '轉數快 / 聚易用', icon: 'fa-qrcode', color: 'bg-emerald-600 text-white', qr: '' },
            { id: 'pay_wx', name: '微信支付', icon: 'fa-weixin', color: 'bg-green-500 text-white', qr: '' },
            { id: 'pay_ali', name: '支付寶', icon: 'fa-alipay', color: 'bg-blue-500 text-white', qr: '' }
        ];

        function App() {
            const [shopName, setShopName] = React.useState(() => {
                return localStorage.getItem('market_shop_name') || '小老闆文創市集助手';
            });

            const [products, setProducts] = React.useState(() => {
                const saved = localStorage.getItem('market_products');
                return saved ? JSON.parse(saved) : DEFAULT_PRODUCTS;
            });

            const [paymentMethods, setPaymentMethods] = React.useState(() => {
                const saved = localStorage.getItem('market_payments');
                return saved ? JSON.parse(saved) : DEFAULT_PAYMENTS;
            });

            const [salesHistory, setSalesHistory] = React.useState(() => {
                const saved = localStorage.getItem('market_sales');
                return saved ? JSON.parse(saved) : [];
            });

            const [activeTab, setActiveTab] = React.useState('pos');
            const [cart, setCart] = React.useState([]);
            const [checkoutModal, setCheckoutModal] = React.useState(false);
            const [payMethod, setPayMethod] = React.useState('cash');
            const [cashReceived, setCashReceived] = React.useState('');
            const [editProductModal, setEditProductModal] = React.useState(null);
            const [showSuccessModal, setShowSuccessModal] = React.useState(false);
            const [lastTransaction, setLastTransaction] = React.useState(null);
            
            const [editShopNameModal, setEditShopNameModal] = React.useState(false);
            const [receiptModal, setReceiptModal] = React.useState(false);

            React.useEffect(() => {
                localStorage.setItem('market_shop_name', shopName);
            }, [shopName]);

            React.useEffect(() => {
                localStorage.setItem('market_products', JSON.stringify(products));
            }, [products]);

            React.useEffect(() => {
                localStorage.setItem('market_payments', JSON.stringify(paymentMethods));
            }, [paymentMethods]);

            React.useEffect(() => {
                localStorage.setItem('market_sales', JSON.stringify(salesHistory));
            }, [salesHistory]);

            const cartTotal = cart.reduce((sum, item) => sum + (item.product.price * item.qty), 0);
            const cartItemCount = cart.reduce((sum, item) => sum + item.qty, 0);

            const exportSalesCSV = () => {
                if (salesHistory.length === 0) return;

                let csvContent = "\uFEFF";
                csvContent += "交易編號,交易時間,商品名稱,單價,數量,小計,支付方式,顧客付額,找零\n";

                salesHistory.forEach(tx => {
                    const timeStr = new Date(tx.timestamp).toLocaleString();
                    tx.items.forEach(item => {
                        const row = [
                            `"${tx.id}"`,
                            `"${timeStr}"`,
                            `"${item.name}"`,
                            item.price,
                            item.qty,
                            item.price * item.qty,
                            `"${tx.paymentName}"`,
                            tx.cashReceived,
                            tx.change
                        ].join(",");
                        csvContent += row + "\n";
                    });
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `${shopName}_營業報表_${new Date().toISOString().slice(0,10)}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const addToCart = (product) => {
                if (product.stock <= 0) return;
                
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    const currentQty = existing ? existing.qty : 0;
                    if (currentQty >= product.stock) return prev;

                    playSound('add');
                    if (existing) {
                        return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
                    } else {
                        return [...prev, { id: product.id, product, qty: 1 }];
                    }
                });
            };

            const updateCartQty = (id, delta) => {
                playSound('click');
                setCart(prev => {
                    return prev.map(item => {
                        if (item.id === id) {
                            const newQty = item.qty + delta;
                            const product = products.find(p => p.id === id);
                            if (newQty <= 0) return null;
                            if (product && newQty > product.stock) return item;
                            return { ...item, qty: newQty };
                        }
                        return item;
                    }).filter(Boolean);
                });
            };

            const clearCart = () => {
                playSound('click');
                setCart([]);
            };

            const handleCompleteCheckout = () => {
                if (cart.length === 0) return;

                playSound('cash');
                try {
                    confetti({
                        particleCount: 80,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                } catch(e) {}

                const updatedProducts = products.map(p => {
                    const cartItem = cart.find(ci => ci.id === p.id);
                    if (cartItem) {
                        return { ...p, stock: Math.max(0, p.stock - cartItem.qty) };
                    }
                    return p;
                });

                const transaction = {
                    id: 'tx_' + Date.now(),
                    timestamp: new Date().toISOString(),
                    items: cart.map(item => ({
                        id: item.product.id,
                        name: item.product.name,
                        price: item.product.price,
                        qty: item.qty
                    })),
                    totalAmount: cartTotal,
                    paymentMethod: payMethod,
                    paymentName: payMethod === 'cash' ? '現金' : (paymentMethods.find(m => m.id === payMethod)?.name || '電子支付'),
                    cashReceived: payMethod === 'cash' ? (parseFloat(cashReceived) || cartTotal) : cartTotal,
                    change: payMethod === 'cash' ? Math.max(0, (parseFloat(cashReceived) || cartTotal) - cartTotal) : 0
                };

                setProducts(updatedProducts);
                setSalesHistory(prev => [transaction, ...prev]);
                setLastTransaction(transaction);
                
                setCart([]);
                setCheckoutModal(false);
                setCashReceived('');
                setShowSuccessModal(true);
            };

            return (
                <div className="flex flex-col app-container w-full max-w-lg mx-auto bg-white shadow-2xl relative overflow-hidden border-x border-slate-200">
                    
                    {/* Header */}
                    <header className="bg-gradient-to-r from-amber-400 via-orange-400 to-rose-400 p-4 text-white shadow-md flex justify-between items-center z-10 shrink-0">
                        <div className="flex items-center space-x-2.5">
                            <span className="text-3xl bg-white/20 p-2 rounded-2xl backdrop-blur-sm">🏬</span>
                            <div>
                                <div className="flex items-center gap-2">
                                    <h1 className="font-black text-xl leading-tight tracking-wide truncate max-w-[170px] sm:max-w-[210px]">{shopName}</h1>
                                    <button 
                                        onClick={() => { playSound('click'); setEditShopNameModal(true); }}
                                        className="bg-white/20 hover:bg-white/30 text-white rounded-lg p-1 text-xs active:scale-95 transition-all"
                                        title="修改攤位名稱"
                                    >
                                        <i className="fa-solid fa-pen"></i>
                                    </button>
                                </div>
                                <p className="text-xs text-amber-100 font-bold">簡單收銀 • 庫存管理 • 統計</p>
                            </div>
                        </div>
                        <div className="bg-white/20 backdrop-blur-md px-3 py-2 rounded-2xl text-xs font-bold border border-white/30 flex flex-col items-end">
                            <span className="text-[11px] text-amber-100">🪙 總營業額</span>
                            <span className="text-yellow-100 text-base font-extrabold">
                                ${salesHistory.reduce((s, t) => s + t.totalAmount, 0)}
                            </span>
                        </div>
                    </header>

                    {/* Main Viewport */}
                    <main className="flex-1 overflow-y-auto bg-slate-50 relative pb-24">
                        {activeTab === 'pos' && (
                            <PosView 
                                products={products} 
                                cart={cart} 
                                addToCart={addToCart} 
                                updateCartQty={updateCartQty}
                                clearCart={clearCart}
                                cartTotal={cartTotal}
                                cartItemCount={cartItemCount}
                                openCheckout={() => { playSound('click'); setCheckoutModal(true); }}
                            />
                        )}

                        {activeTab === 'inventory' && (
                            <InventoryView 
                                products={products} 
                                setProducts={setProducts}
                                openEditModal={(p) => setEditProductModal(p)}
                            />
                        )}

                        {activeTab === 'stats' && (
                            <StatsView 
                                salesHistory={salesHistory}
                                products={products}
                                openReceiptModal={() => { playSound('click'); setReceiptModal(true); }}
                                exportCSV={exportSalesCSV}
                                clearHistory={() => {
                                    setSalesHistory([]);
                                }}
                            />
                        )}

                        {activeTab === 'settings' && (
                            <SettingsView 
                                paymentMethods={paymentMethods}
                                setPaymentMethods={setPaymentMethods}
                                resetDemoData={() => {
                                    setProducts(DEFAULT_PRODUCTS);
                                    setPaymentMethods(DEFAULT_PAYMENTS);
                                    setSalesHistory([]);
                                    setShopName('小老闆文創市集助手');
                                    localStorage.clear();
                                }}
                            />
                        )}
                    </main>

                    {/* Bottom Navigation */}
                    <nav className="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-2 py-2 flex justify-around items-center z-10 shadow-lg">
                        <NavButton 
                            active={activeTab === 'pos'} 
                            onClick={() => { playSound('click'); setActiveTab('pos'); }} 
                            icon="fa-cash-register" 
                            label="收銀台" 
                            badge={cartItemCount}
                        />
                        <NavButton 
                            active={activeTab === 'inventory'} 
                            onClick={() => { playSound('click'); setActiveTab('inventory'); }} 
                            icon="fa-boxes-stacked" 
                            label="庫存/商品" 
                        />
                        <NavButton 
                            active={activeTab === 'stats'} 
                            onClick={() => { playSound('click'); setActiveTab('stats'); }} 
                            icon="fa-chart-pie" 
                            label="營業統計" 
                        />
                        <NavButton 
                            active={activeTab === 'settings'} 
                            onClick={() => { playSound('click'); setActiveTab('settings'); }} 
                            icon="fa-sliders" 
                            label="系統設定" 
                        />
                    </nav>

                    {/* Modals */}
                    {editShopNameModal && (
                        <EditShopNameModal 
                            shopName={shopName}
                            onClose={() => setEditShopNameModal(false)}
                            onSave={(newName) => {
                                setShopName(newName);
                                setEditShopNameModal(false);
                            }}
                        />
                    )}

                    {receiptModal && (
                        <ReceiptModal 
                            shopName={shopName}
                            salesHistory={salesHistory}
                            onClose={() => setReceiptModal(false)}
                            onConfirmExport={() => {
                                exportSalesCSV();
                                setReceiptModal(false);
                            }}
                        />
                    )}

                    {checkoutModal && (
                        <CheckoutModal 
                            cart={cart}
                            cartTotal={cartTotal}
                            paymentMethods={paymentMethods}
                            payMethod={payMethod}
                            setPayMethod={setPayMethod}
                            cashReceived={cashReceived}
                            setCashReceived={setCashReceived}
                            onClose={() => setCheckoutModal(false)}
                            onConfirm={handleCompleteCheckout}
                        />
                    )}

                    {showSuccessModal && lastTransaction && (
                        <SuccessModal 
                            transaction={lastTransaction}
                            onClose={() => setShowSuccessModal(false)}
                        />
                    )}

                    {editProductModal && (
                        <EditProductModal 
                            product={editProductModal === 'new' ? null : editProductModal}
                            onClose={() => setEditProductModal(null)}
                            onSave={(savedProduct) => {
                                if (editProductModal === 'new') {
                                    setProducts([...products, { ...savedProduct, id: 'p_' + Date.now() }]);
                                } else {
                                    setProducts(products.map(p => p.id === savedProduct.id ? savedProduct : p));
                                }
                                setEditProductModal(null);
                            }}
                            onDelete={(id) => {
                                setProducts(products.filter(p => p.id !== id));
                                setEditProductModal(null);
                            }}
                        />
                    )}
                </div>
            );
        }

        function PosView({ products, cart, addToCart, updateCartQty, clearCart, cartTotal, cartItemCount, openCheckout }) {
            const [showCartDrawer, setShowCartDrawer] = React.useState(false);

            return (
                <div className="p-3 space-y-4">
                    {/* Products Grid */}
                    <div>
                        <div className="flex justify-between items-center mb-2 px-1">
                            <h2 className="text-sm font-black text-slate-700 flex items-center gap-1.5">
                                <i className="fa-solid fa-store text-amber-500"></i>
                                點擊商品加入購物車
                            </h2>
                            <span className="text-xs text-slate-400 font-bold">共 {products.length} 項商品</span>
                        </div>

                        <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                            {products.map(product => {
                                const isOut = product.stock <= 0;
                                const inCart = cart.find(i => i.id === product.id);
                                const cartQty = inCart ? inCart.qty : 0;

                                return (
                                    <button
                                        key={product.id}
                                        onClick={() => addToCart(product)}
                                        disabled={isOut}
                                        className={`p-3 rounded-2xl border text-left relative flex flex-col justify-between transition-all active:scale-95 shadow-sm ${
                                            isOut 
                                                ? 'bg-slate-100 border-slate-200 opacity-60 cursor-not-allowed' 
                                                : 'bg-white border-slate-200 hover:border-amber-400 hover:shadow-md'
                                        }`}
                                    >
                                        {/* Cart Qty Badge */}
                                        {cartQty > 0 && (
                                            <span className="absolute -top-2 -right-2 bg-rose-500 text-white font-black text-xs px-2 py-0.5 rounded-full shadow-md z-10 animate-bounce">
                                                +{cartQty}
                                            </span>
                                        )}

                                        <div className="flex items-center justify-center h-20 mb-2 rounded-xl bg-slate-50 relative overflow-hidden">
                                            {product.image ? (
                                                <img src={product.image} alt={product.name} className="w-full h-full object-cover rounded-xl" />
                                            ) : (
                                                <span className="text-4xl">{product.icon || '🎨'}</span>
                                            )}
                                            {isOut && (
                                                <div className="absolute inset-0 bg-slate-900/60 flex items-center justify-center">
                                                    <span className="text-white font-black text-xs bg-rose-600 px-2 py-1 rounded-md">完售</span>
                                                </div>
                                            )}
                                        </div>

                                        <div>
                                            <h3 className="font-bold text-xs text-slate-800 line-clamp-1">{product.name}</h3>
                                            <div className="flex justify-between items-center mt-1">
                                                <span className="font-extrabold text-amber-600 text-sm">${product.price}</span>
                                                <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${
                                                    product.stock < 5 ? 'bg-rose-100 text-rose-600' : 'bg-slate-100 text-slate-500'
                                                }`}>
                                                    剩 {product.stock}
                                                </span>
                                            </div>
                                        </div>
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    {/* Cart Summary Bar & Checkout Launcher */}
                    {cartItemCount > 0 && (
                        <div className="fixed bottom-16 left-0 right-0 max-w-lg mx-auto p-3 z-20">
                            <div className="bg-slate-900 text-white rounded-3xl p-3 shadow-2xl flex justify-between items-center border border-slate-700">
                                <button 
                                    onClick={() => setShowCartDrawer(!showCartDrawer)}
                                    className="flex items-center space-x-3 px-2 active:scale-95 transition-all"
                                >
                                    <div className="relative">
                                        <div className="w-10 h-10 bg-amber-400 text-slate-900 rounded-2xl flex items-center justify-center text-lg font-black shadow-md">
                                            🛒
                                        </div>
                                        <span className="absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] font-extrabold w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-900">
                                            {cartItemCount}
                                        </span>
                                    </div>
                                    <div className="text-left">
                                        <div className="text-[11px] text-slate-400 font-bold flex items-center gap-1">
                                            <span>點擊看明細</span>
                                            <i className={`fa-solid ${showCartDrawer ? 'fa-chevron-down' : 'fa-chevron-up'} text-[10px]`}></i>
                                        </div>
                                        <div className="text-lg font-black text-amber-300">${cartTotal}</div>
                                    </div>
                                </button>

                                <button 
                                    onClick={openCheckout}
                                    className="bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-slate-950 font-black px-5 py-2.5 rounded-2xl text-sm shadow-lg bounce-active flex items-center space-x-1.5"
                                >
                                    <span>前往結帳</span>
                                    <i className="fa-solid fa-arrow-right"></i>
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Cart Drawer */}
                    {showCartDrawer && cartItemCount > 0 && (
                        <div className="fixed inset-0 bg-slate-900/50 z-10 backdrop-blur-sm flex items-end justify-center p-3">
                            <div className="bg-white w-full max-w-lg rounded-3xl p-4 shadow-2xl space-y-3 mb-28 pop-in">
                                <div className="flex justify-between items-center border-b pb-2">
                                    <h3 className="font-bold text-sm text-slate-800 flex items-center gap-1.5">
                                        <i className="fa-solid fa-basket-shopping text-amber-500"></i>
                                        已選購物車內容
                                    </h3>
                                    <button onClick={clearCart} className="text-xs text-rose-500 font-bold hover:underline">
                                        清空購物車
                                    </button>
                                </div>

                                <div className="space-y-2 max-h-56 overflow-y-auto">

                                    <button 
                                        onClick={() => setCashReceived(cartTotal.toString())} 
                                        className="bg-amber-200 hover:bg-amber-300 text-amber-900 font-bold px-2.5 py-1 rounded-lg text-xs"
                                    >
                                        剛好 ${cartTotal}
                                    </button>
                                    {quickBills.map(b => (
                                        <button 
                                            key={b}
                                            onClick={() => setCashReceived(b.toString())}
                                            className="bg-white border text-slate-700 font-bold px-2 py-1 rounded-lg text-xs hover:bg-slate-100"
                                        >
                                            ${b}
                                        </button>
                                    ))}
                                </div>

                                {/* Change Display */}
                                <div className="bg-white p-3 rounded-xl border flex justify-between items-center">
                                    <span className="text-xs font-bold text-slate-600">應找金額：</span>
                                    <span className={`text-xl font-black ${change < 0 ? 'text-rose-500' : 'text-emerald-600'}`}>
                                        ${numCash >= cartTotal ? change : 0}
                                    </span>
                                </div>
                            </div>
                        ) : (
                            /* E-payment QR mode UI */
                            <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 text-center space-y-3">
                                <h4 className="font-bold text-xs text-slate-700 flex items-center justify-center gap-1">
                                    <i className="fa-solid fa-qrcode text-sky-500"></i>
                                    請展示下方 {selectedPayObj?.name} QR Code 給顧客掃碼
                                </h4>

                                {selectedPayObj?.qr ? (
                                    <div className="bg-white p-3 rounded-2xl shadow-inner inline-block border border-slate-200">
                                        <img src={selectedPayObj.qr} alt={selectedPayObj.name} className="w-44 h-44 object-contain mx-auto" />
                                    </div>
                                ) : (
                                    <div className="bg-amber-50 border border-amber-200 p-4 rounded-2xl text-amber-800 text-xs font-bold space-y-1">
                                        <i className="fa-solid fa-circle-info text-lg text-amber-500"></i>
                                        <p>尚未設定 {selectedPayObj?.name} 的收款 QR Code 圖片。</p>
                                        <p className="text-[10px] text-amber-600">可以在「系統設定」分頁中上傳！</p>
                                    </div>
                                )}

                                <p className="text-[11px] font-bold text-slate-500">
                                    確認收到 <span className="text-amber-600 font-black text-sm">${cartTotal}</span> 後請點擊下方確認按鈕。
                                </p>
                            </div>
                        )}

                        <button 
                            onClick={onConfirm}
                            className="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black py-3 rounded-2xl text-sm shadow-lg bounce-active flex items-center justify-center space-x-2"
                        >
                            <i className="fa-solid fa-check text-base"></i>
                            <span>完成交易扣減庫存</span>
                        </button>
                    </div>
                </div>
            );
        }

        function SuccessModal({ transaction, onClose }) {
            return (
                <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 pop-in">
                    <div className="bg-white w-full max-w-xs rounded-3xl p-6 shadow-2xl text-center space-y-4">
                        <div className="w-16 h-16 bg-emerald-100 text-emerald-500 rounded-full flex items-center justify-center text-3xl mx-auto shadow-inner">
                            🎉
                        </div>

                        <div>
                            <h3 className="font-black text-lg text-slate-800">交易成功！</h3>
                            <p className="text-xs text-slate-500 font-bold mt-1">太棒了！又成功賣出一單！</p>
                        </div>

                        <div className="bg-slate-50 p-3 rounded-2xl border space-y-1 text-xs">
                            <div className="flex justify-between text-slate-600">
                                <span>付款方式：</span>
                                <span className="font-bold text-slate-800">{transaction.paymentName}</span>
                            </div>
                            <div className="flex justify-between text-slate-600">
                                <span>交易總額：</span>
                                <span className="font-extrabold text-amber-600">${transaction.totalAmount}</span>
                            </div>
                            {transaction.paymentMethod === 'cash' && (
                                <div className="flex justify-between text-slate-600 pt-1 border-t">
                                    <span>找零金額：</span>
                                    <span className="font-extrabold text-emerald-600">${transaction.change}</span>
                                </div>
                            )}
                        </div>

                        <button 
                            onClick={() => { playSound('click'); onClose(); }}
                            className="w-full bg-amber-400 hover:bg-amber-500 text-slate-900 font-black py-3 rounded-2xl text-xs shadow-md bounce-active"
                        >
                            繼續下一筆收銀
                        </button>
                    </div>
                </div>
            );
        }

        function EditProductModal({ product, onClose, onSave, onDelete }) {
            const [name, setName] = React.useState(product?.name || '');
            const [price, setPrice] = React.useState(product?.price || 10);
            const [stock, setStock] = React.useState(product?.stock || 10);
            const [icon, setIcon] = React.useState(product?.icon || '🎨');
            const [image, setImage] = React.useState(product?.image || '');
            const [showCamera, setShowCamera] = React.useState(false);
            const [cameraLoading, setCameraLoading] = React.useState(false);
            const [cameraError, setCameraError] = React.useState(null);
            const [formError, setFormError] = React.useState('');

            const videoRef = React.useRef(null);
            const streamRef = React.useRef(null);

            const EMOJI_OPTIONS = ['🎨', '🖼️', '🔑', '📿', '🏷️', '🧸', '🧶', '🪴', '🧦', '🧁', '🍪', '📖'];

            React.useEffect(() => {
                if (showCamera) {
                    let isMounted = true;
                    setCameraLoading(true);
                    setCameraError(null);

                    const timeoutId = setTimeout(() => {
                        if (isMounted && cameraLoading) {
                            setCameraLoading(false);
                            setCameraError('鏡頭啟動逾時。沙盒預覽或瀏覽器限制了即時鏡頭存取。請直接點選下方「相機/相簿」上傳！');
                        }
                    }, 3500);

                    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                        navigator.mediaDevices.getUserMedia({ 
                            video: { facingMode: { ideal: 'environment' } }, 
                            audio: false 
                        })
                        .then(stream => {
                            clearTimeout(timeoutId);
                            if (!isMounted) {
                                stream.getTracks().forEach(t => t.stop());
                                return;
                            }
                            setCameraLoading(false);
                            streamRef.current = stream;
                            if (videoRef.current) {
                                videoRef.current.srcObject = stream;
                            }
                        })
                        .catch(err => {
                            clearTimeout(timeoutId);
                            console.warn("Camera access fallback triggered:", err);
                            if (isMounted) {
                                setCameraLoading(false);
                                setCameraError('無法存取即時鏡頭。請直接點擊「相機/相簿」按鈕拍攝照片。');
                            }
                        });
                    } else {
                        clearTimeout(timeoutId);
                        setCameraLoading(false);
                        setCameraError('當前環境不支援即時鏡頭，請使用「相機/相簿」選擇照片。');
                    }

                    return () => {
                        isMounted = false;
                        clearTimeout(timeoutId);
                        if (streamRef.current) {
                            streamRef.current.getTracks().forEach(track => track.stop());
                            streamRef.current = null;
                        }
                    };
                }
            }, [showCamera]);

            const takeSnapShot = () => {
                if (!videoRef.current) return;
                playSound('add');
                const video = videoRef.current;
                const canvas = document.createElement('canvas');
                const maxDim = 400;
                let w = video.videoWidth || 640;
                let h = video.videoHeight || 480;

                if (w > h) {
                    if (w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
                } else {
                    if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }
                }

                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, w, h);
                const compressedBase64 = canvas.toDataURL('image/jpeg', 0.85);
                
                setImage(compressedBase64);
                setShowCamera(false);
            };

            const handlePhotoUpload = (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 300;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_SIZE) {
                                height *= MAX_SIZE / width;
                                width = MAX_SIZE;
                            }
                        } else {
                            if (height > MAX_SIZE) {
                                width *= MAX_SIZE / height;
                                height = MAX_SIZE;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);
                        setImage(compressedBase64);
                        playSound('add');
                        setShowCamera(false);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 pop-in">
                    <div className="bg-white w-full max-w-xs rounded-3xl p-5 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                        <h3 className="font-black text-base text-slate-800">
                            {product ? '修改商品資料' : '新增市集商品'}
                        </h3>

                        {showCamera ? (
                            <div className="space-y-3 bg-slate-900 p-3 rounded-2xl text-center text-white">
                                <div className="relative rounded-xl overflow-hidden bg-black aspect-square flex items-center justify-center">
                                    {cameraLoading ? (
                                        <div className="text-center p-4">
                                            <i className="fa-solid fa-spinner fa-spin text-3xl text-amber-400 mb-2"></i>
                                            <p className="text-xs font-bold text-slate-300">正在開啟鏡頭...</p>
                                        </div>
                                    ) : cameraError ? (
                                        <div className="text-center p-3 text-rose-300 text-xs space-y-2">
                                            <i className="fa-solid fa-triangle-exclamation text-2xl text-amber-400"></i>
                                            <p className="font-bold leading-relaxed">{cameraError}</p>
                                        </div>
                                    ) : (
                                        <video 
                                            ref={videoRef} 
                                            autoPlay 
                                            playsInline 
                                            muted 
                                            className="w-full h-full object-cover"
                                        />
                                    )}
                                    <div className="absolute inset-0 border-2 border-white/30 rounded-xl pointer-events-none"></div>
                                </div>

                                <div className="flex gap-2">
                                    <button 
                                        type="button" 
                                        onClick={() => setShowCamera(false)} 
                                        className="flex-1 py-2 rounded-xl bg-slate-800 text-xs font-bold text-slate-300"
                                    >
                                        返回
                                    </button>

                                    {!cameraError && !cameraLoading && (
                                        <button 
                                            type="button" 
                                            onClick={takeSnapShot} 
                                            className="flex-1 py-2 rounded-xl bg-amber-400 text-xs font-black text-slate-900 shadow-lg flex items-center justify-center gap-1"
                                        >
                                            <i className="fa-solid fa-camera"></i> 快門拍照
                                        </button>
                                    )}

                                    <label className="flex-1 py-2 rounded-xl bg-sky-500 text-xs font-black text-white shadow-lg flex items-center justify-center gap-1 cursor-pointer">
                                        <i className="fa-solid fa-image"></i> 相機/相簿
                                        <input 
                                            type="file" 
                                            accept="image/*" 
                                            capture="environment"
                                            className="hidden" 
                                            onChange={handlePhotoUpload}
                                        />
                                    </label>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-3 text-xs">
                                {formError && (
                                    <div className="bg-rose-100 border border-rose-300 text-rose-700 px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-2">
                                        <i className="fa-solid fa-circle-exclamation"></i>
                                        <span>{formError}</span>
                                    </div>
                                )}

                                <div>
                                    <label className="font-bold text-slate-600 block mb-1">商品相片 / 圖示</label>
                                    
                                    {image ? (
                                        <div className="flex items-center space-x-3 bg-slate-50 p-2 rounded-2xl border border-slate-200">
                                            <img src={image} alt="預覽" className="w-14 h-14 object-cover rounded-xl shadow-sm border border-white shrink-0" />
                                            <div className="flex-1">
                                                <p className="font-bold text-slate-700 text-xs">已選擇商品相片</p>
                                                <p className="text-[10px] text-slate-400">已為您完成尺寸最佳化</p>
                                            </div>
                                            <button 
                                                type="button"
                                                onClick={() => setImage('')}
                                                className="text-xs text-rose-500 hover:text-rose-700 font-bold p-2 bg-rose-50 rounded-xl shrink-0"
                                            >
                                                移除
                                            </button>
                                        </div>
                                    ) : (
                                        <div className="space-y-2">
                                            <div className="grid grid-cols-2 gap-2">
                                                <button 
                                                    type="button"
                                                    onClick={() => setShowCamera(true)}
                                                    className="flex flex-col items-center justify-center py-2.5 px-2 bg-amber-50 hover:bg-amber-100 border-2 border-amber-300 text-amber-900 rounded-2xl font-bold transition-all active:scale-95"
                                                >
                                                    <i className="fa-solid fa-camera text-lg text-amber-600 mb-0.5"></i>
                                                    <span className="text-[11px]">即時鏡頭</span>
                                                </button>

                                                <label className="flex flex-col items-center justify-center py-2.5 px-2 bg-sky-50 hover:bg-sky-100 border-2 border-sky-300 text-sky-900 rounded-2xl font-bold cursor-pointer transition-all active:scale-95">
                                                    <i className="fa-solid fa-image text-lg text-sky-600 mb-0.5"></i>
                                                    <span className="text-[11px]">相機/相簿上傳</span>
                                                    <input 
                                                        type="file" 
                                                        accept="image/*" 
                                                        capture="environment"
                                                        className="hidden" 
                                                        onChange={handlePhotoUpload}
                                                    />
                                                </label>
                                            </div>

                                            <div className="text-center text-[10px] text-slate-400 font-bold pt-1">或選擇預設可愛圖示</div>
                                            <div className="grid grid-cols-6 gap-1 bg-slate-50 p-2 rounded-xl">
                                                {EMOJI_OPTIONS.map(e => (
                                                    <button 
                                                        key={e} 
                                                        type="button"
                                                        onClick={() => { setIcon(e); setImage(''); }}
                                                        className={`p-1.5 rounded-lg text-lg ${icon === e && !image ? 'bg-amber-300 shadow-sm' : 'hover:bg-slate-200'}`}
                                                    >
                                                        {e}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div>
                                    <label className="font-bold text-slate-600 block mb-1">商品名稱</label>
                                    <input 
                                        type="text" 
                                        value={name}
                                        onChange={(e) => { setName(e.target.value); setFormError(''); }}
                                        placeholder="例如: 手作黏土公仔"
                                        className="w-full p-2.5 border rounded-xl font-bold outline-none focus:border-amber-400"
                                    />
                                </div>

                                <div className="grid grid-cols-2 gap-2">
                                    <div>
                                        <label className="font-bold text-slate-600 block mb-1">單價 ($)</label>
                                        <input 
                                            type="number" 
                                            value={price}
                                            onChange={(e) => setPrice(Number(e.target.value))}
                                            className="w-full p-2.5 border rounded-xl font-bold outline-none focus:border-amber-400"
                                        />
                                    </div>
                                    <div>
                                        <label className="font-bold text-slate-600 block mb-1">庫存數量</label>
                                        <input 
                                            type="number" 
                                            value={stock}
                                            onChange={(e) => setStock(Number(e.target.value))}
                                            className="w-full p-2.5 border rounded-xl font-bold outline-none focus:border-amber-400"
                                        />
                                    </div>
                                </div>
                            </div>
                        )}

                        {!showCamera && (
                            <div className="flex space-x-2 pt-2">
                                {product && (
                                    <button 
                                        onClick={() => onDelete(product.id)}
                                        className="bg-rose-100 text-rose-600 font-bold px-3 py-2.5 rounded-xl text-xs"
                                    >
                                        刪除
                                    </button>
                                )}
                                <button 
                                    onClick={onClose}
                                    className="flex-1 bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-xs"
                                >
                                    取消
                                </button>
                                <button 
                                    onClick={() => {
                                        if(!name.trim()) {
                                            setFormError('請輸入商品名稱');
                                            return;
                                        }
                                        onSave({ ...product, name: name.trim(), price, stock, icon, image });
                                    }}
                                    className="flex-1 bg-amber-400 text-slate-900 font-black py-2.5 rounded-xl text-xs shadow-md"
                                >
                                    儲存
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function SettingsView({ paymentMethods, setPaymentMethods, resetDemoData }) {
            const [showResetConfirm, setShowResetConfirm] = React.useState(false);

            const handleQRUpload = (id, event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    const base64Img = e.target.result;
                    setPaymentMethods(paymentMethods.map(m => m.id === id ? { ...m, qr: base64Img } : m));
                    playSound('add');
                };
                reader.readAsDataURL(file);
            };

            const removeQR = (id) => {
                setPaymentMethods(paymentMethods.map(m => m.id === id ? { ...m, qr: '' } : m));
            };

            return (
                <div className="p-4 space-y-4">
                    <div>
                        <h2 className="text-base font-bold text-slate-800">電子支付與系統設定</h2>
                        <p className="text-xs text-slate-500">上傳您的電子支付收款 QR Code 圖片</p>
                    </div>

                    <div className="space-y-3">
                        {paymentMethods.map(method => (
                            <div key={method.id} className="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                                <div className="flex justify-between items-center">
                                    <div className="flex items-center space-x-2">
                                        <div className={`w-8 h-8 rounded-lg flex items-center justify-center ${method.color}`}>
                                            <i className={`fa-solid ${method.icon}`}></i>
                                        </div>
                                        <span className="font-bold text-sm text-slate-800">{method.name}</span>
                                    </div>
                                    <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${method.qr ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-400'}`}>
                                        {method.qr ? '已設定收款碼' : '未上傳'}
                                    </span>
                                </div>

                                {method.qr ? (
                                    <div className="flex items-center space-x-3 bg-slate-50 p-2 rounded-xl border border-slate-100">
                                        <img src={method.qr} alt={method.name} className="w-16 h-16 object-contain rounded-lg border bg-white" />
                                        <div className="flex-1">
                                            <p className="text-xs text-slate-600 font-bold">已上傳收款 Code</p>
                                            <p className="text-[10px] text-slate-400">結帳選此支付時將展示這張圖</p>
                                        </div>
                                        <button 
                                            onClick={() => removeQR(method.id)}
                                            className="text-xs text-rose-500 hover:text-rose-700 p-2 font-bold"
                                        >
                                            移除
                                        </button>
                                    </div>
                                ) : (
                                    <label className="block w-full border-2 border-dashed border-slate-300 hover:border-amber-400 rounded-xl p-3 text-center cursor-pointer transition-colors bg-slate-50">
                                        <i className="fa-solid fa-cloud-arrow-up text-amber-500 text-lg mb-1 block"></i>
                                        <span className="text-xs font-bold text-slate-600 block">上傳 {method.name} 收款圖片</span>
                                        <span className="text-[10px] text-slate-400 block">點擊選擇照片/拍攝相簿</span>
                                        <input 
                                            type="file" 
                                            accept="image/*" 
                                            className="hidden" 
                                            onChange={(e) => handleQRUpload(method.id, e)}
                                        />
                                    </label>
                                )}
                            </div>
                        ))}
                    </div>

                    <div className="pt-4">
                        {!showResetConfirm ? (
                            <button 
                                onClick={() => setShowResetConfirm(true)}
                                className="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2.5 rounded-xl text-xs transition-colors"
                            >
                                <i className="fa-solid fa-rotate-left mr-1"></i> 重置所有資料與範例商品
                            </button>
                        ) : (
                            <div className="bg-rose-50 border border-rose-200 p-3 rounded-2xl text-center space-y-2">
                                <p className="text-xs font-bold text-rose-700">確定重置為預設資料？所有變更與銷售紀錄將被清除。</p>
                                <div className="flex gap-2 justify-center">
                                    <button 
                                        onClick={() => { resetDemoData(); setShowResetConfirm(false); }}
                                        className="bg-rose-600 text-white font-bold px-4 py-1.5 rounded-xl text-xs"
                                    >
                                        確認重置
                                    </button>
                                    <button 
                                        onClick={() => setShowResetConfirm(false)}
                                        className="bg-slate-200 text-slate-700 font-bold px-4 py-1.5 rounded-xl text-xs"
                                    >
                                        取消
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function NavButton({ active, onClick, icon, label, badge }) {
            return (
                <button 
                    onClick={onClick}
                    className={`flex flex-col items-center justify-center py-2 px-3 rounded-2xl transition-all relative min-w-[68px] ${
                        active ? 'text-amber-500 font-black scale-105 bg-amber-50' : 'text-slate-400 font-bold'
                    }`}
                >
                    <i className={`fa-solid ${icon} text-xl mb-1`}></i>
                    <span className="text-xs">{label}</span>
                    {badge > 0 && (
                        <span className="absolute top-1 right-2 bg-rose-500 text-white rounded-full w-5 h-5 text-xs flex items-center justify-center font-black shadow-md border-2 border-white">
                            {badge}
                        </span>
                    )}
                </button>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
