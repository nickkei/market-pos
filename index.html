<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小老闆文創市集助手</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- FontAwesome for cute icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            background-color: #F8FAFC;
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 999px;
        }
        .bounce-active:active {
            transform: scale(0.95);
        }
        .pop-in {
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-amber-200">
    <div id="root"></div>

    <script type="text/babel">
        // 音效產生器 (無須外部資源)
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (type === 'click') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.08); // A5
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'add') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.12);
                } else if (type === 'cash') {
                    // 模擬收銀機叮噹聲
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, ctx.currentTime + (i * 0.06));
                        gain.gain.setValueAtTime(0.25, ctx.currentTime + (i * 0.06));
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (i * 0.06) + 0.25);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + (i * 0.06));
                        osc.stop(ctx.currentTime + (i * 0.06) + 0.25);
                    });
                }
            } catch (e) {
                console.log("Audio not supported or blocked");
            }
        };

        // 預設樣板商品
        const DEFAULT_PRODUCTS = [
            { id: 'p1', name: '手作黏土公仔', price: 30, stock: 10, icon: '🎨', color: 'bg-rose-100 text-rose-600' },
            { id: 'p2', name: '手繪插畫明信片', price: 15, stock: 25, icon: '🖼️', color: 'bg-amber-100 text-amber-600' },
            { id: 'p3', name: '羊毛氈鑰匙圈', price: 45, stock: 8, icon: '🔑', color: 'bg-emerald-100 text-emerald-600' },
            { id: 'p4', name: '繽紛串珠手鍊', price: 20, stock: 15, icon: '📿', color: 'bg-sky-100 text-sky-600' },
            { id: 'p5', name: '文創可愛貼紙包', price: 10, stock: 30, icon: '🏷️', color: 'bg-purple-100 text-purple-600' },
        ];

        // 預設電子支付平台
        const DEFAULT_PAYMENTS = [
            { id: 'pay_mpay', name: 'MPay 澳門通', icon: 'fa-mobile-screen-button', color: 'bg-red-500 text-white', qr: '' },
            { id: 'pay_fps', name: '轉數快 / 聚易用', icon: 'fa-qrcode', color: 'bg-emerald-600 text-white', qr: '' },
            { id: 'pay_wx', name: '微信支付', icon: 'fa-weixin', color: 'bg-green-500 text-white', qr: '' },
            { id: 'pay_ali', name: '支付寶', icon: 'fa-alipay', color: 'bg-blue-500 text-white', qr: '' }
        ];

        function App() {
            // State initialization from LocalStorage or defaults
            const [products, setProducts] = React.useState(() => {
                const saved = localStorage.getItem('market_products');
                return saved ? JSON.parse(saved) : DEFAULT_PRODUCTS;
            });

            const [paymentMethods, setPaymentMethods] = React.useState(() => {
                const saved = localStorage.getItem('market_payments');
                return saved ? JSON.parse(saved) : DEFAULT_PAYMENTS;
            });

            const [salesHistory, setSalesHistory] = React.useState(() => {
                const saved = localStorage.getItem('market_sales');
                return saved ? JSON.parse(saved) : [];
            });

            const [activeTab, setActiveTab] = React.useState('pos'); // pos, inventory, stats, settings
            const [cart, setCart] = React.useState([]); // [{ id, product, qty }]
            const [checkoutModal, setCheckoutModal] = React.useState(false);
            const [payMethod, setPayMethod] = React.useState('cash'); // 'cash' or paymentMethod.id
            const [cashReceived, setCashReceived] = React.useState('');
            const [editProductModal, setEditProductModal] = React.useState(null); // product obj or 'new'
            const [showSuccessModal, setShowSuccessModal] = React.useState(false);
            const [lastTransaction, setLastTransaction] = React.useState(null);

            // Save state to LocalStorage
            React.useEffect(() => {
                localStorage.setItem('market_products', JSON.stringify(products));
            }, [products]);

            React.useEffect(() => {
                localStorage.setItem('market_payments', JSON.stringify(paymentMethods));
            }, [paymentMethods]);

            React.useEffect(() => {
                localStorage.setItem('market_sales', JSON.stringify(salesHistory));
            }, [salesHistory]);

            // Cart calculations
            const cartTotal = cart.reduce((sum, item) => sum + (item.product.price * item.qty), 0);
            const cartItemCount = cart.reduce((sum, item) => sum + item.qty, 0);

            // Add item to cart
            const addToCart = (product) => {
                if (product.stock <= 0) return;
                
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    const currentQty = existing ? existing.qty : 0;
                    if (currentQty >= product.stock) return prev; // Limit to stock

                    playSound('add');
                    if (existing) {
                        return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
                    } else {
                        return [...prev, { id: product.id, product, qty: 1 }];
                    }
                });
            };

            // Modify cart item qty
            const updateCartQty = (id, delta) => {
                playSound('click');
                setCart(prev => {
                    return prev.map(item => {
                        if (item.id === id) {
                            const newQty = item.qty + delta;
                            const product = products.find(p => p.id === id);
                            if (newQty <= 0) return null;
                            if (product && newQty > product.stock) return item;
                            return { ...item, qty: newQty };
                        }
                        return item;
                    }).filter(Boolean);
                });
            };

            const clearCart = () => {
                playSound('click');
                setCart([]);
            };

            // Execute checkout
            const handleCompleteCheckout = () => {
                if (cart.length === 0) return;

                playSound('cash');
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });

                // Deduct stock
                const updatedProducts = products.map(p => {
                    const cartItem = cart.find(ci => ci.id === p.id);
                    if (cartItem) {
                        return { ...p, stock: Math.max(0, p.stock - cartItem.qty) };
                    }
                    return p;
                });

                // Record sale
                const transaction = {
                    id: 'tx_' + Date.now(),
                    timestamp: new Date().toISOString(),
                    items: cart.map(item => ({
                        id: item.product.id,
                        name: item.product.name,
                        price: item.product.price,
                        qty: item.qty
                    })),
                    totalAmount: cartTotal,
                    paymentMethod: payMethod, // 'cash' or payMethod id
                    paymentName: payMethod === 'cash' ? '現金' : (paymentMethods.find(m => m.id === payMethod)?.name || '電子支付'),
                    cashReceived: payMethod === 'cash' ? (parseFloat(cashReceived) || cartTotal) : cartTotal,
                    change: payMethod === 'cash' ? Math.max(0, (parseFloat(cashReceived) || cartTotal) - cartTotal) : 0
                };

                setProducts(updatedProducts);
                setSalesHistory(prev => [transaction, ...prev]);
                setLastTransaction(transaction);
                
                // Reset checkout state
                setCart([]);
                setCheckoutModal(false);
                setCashReceived('');
                setShowSuccessModal(true);
            };

            return (
                <div className="flex flex-col h-screen max-w-md mx-auto bg-white shadow-2xl relative overflow-hidden border-x border-slate-200">
                    
                    {/* Header */}
                    <header className="bg-gradient-to-r from-amber-400 via-orange-400 to-rose-400 p-4 text-white shadow-md flex justify-between items-center z-10">
                        <div className="flex items-center space-x-2">
                            <span className="text-2xl bg-white/20 p-2 rounded-2xl backdrop-blur-sm">🏬</span>
                            <div>
                                <h1 className="font-black text-lg leading-tight tracking-wide">小老闆文創市集助手</h1>
                                <p className="text-xs text-amber-100 font-medium">簡單收銀 • 庫存管理 • 統計</p>
                            </div>
                        </div>
                        <div className="bg-white/20 backdrop-blur-md px-3 py-1.5 rounded-full text-xs font-bold border border-white/30 flex items-center gap-1">
                            <span>🪙 營業額</span>
                            <span className="text-yellow-100 text-sm font-extrabold">
                                ${salesHistory.reduce((s, t) => s + t.totalAmount, 0)}
                            </span>
                        </div>
                    </header>

                    {/* Main Content Viewport */}
                    <main className="flex-1 overflow-y-auto bg-slate-50 relative pb-20">
                        {activeTab === 'pos' && (
                            <PosView 
                                products={products} 
                                cart={cart} 
                                addToCart={addToCart} 
                                updateCartQty={updateCartQty}
                                clearCart={clearCart}
                                cartTotal={cartTotal}
                                cartItemCount={cartItemCount}
                                openCheckout={() => { playSound('click'); setCheckoutModal(true); }}
                            />
                        )}

                        {activeTab === 'inventory' && (
                            <InventoryView 
                                products={products} 
                                setProducts={setProducts}
                                openEditModal={(p) => setEditProductModal(p)}
                            />
                        )}

                        {activeTab === 'stats' && (
                            <StatsView 
                                salesHistory={salesHistory}
                                products={products}
                                clearHistory={() => {
                                    if(confirm("確定要清空所有營業統計紀錄嗎？(無法復原)")) {
                                        setSalesHistory([]);
                                    }
                                }}
                            />
                        )}

                        {activeTab === 'settings' && (
                            <SettingsView 
                                paymentMethods={paymentMethods}
                                setPaymentMethods={setPaymentMethods}
                                resetDemoData={() => {
                                    if(confirm("重置為預設商品與設定？")) {
                                        setProducts(DEFAULT_PRODUCTS);
                                        setPaymentMethods(DEFAULT_PAYMENTS);
                                        setSalesHistory([]);
                                        localStorage.clear();
                                    }
                                }}
                            />
                        )}
                    </main>

                    {/* Bottom Navigation */}
                    <nav className="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-2 py-2 flex justify-around items-center z-10 shadow-lg">
                        <NavButton 
                            active={activeTab === 'pos'} 
                            onClick={() => { playSound('click'); setActiveTab('pos'); }} 
                            icon="fa-cash-register" 
                            label="收銀台" 
                            badge={cartItemCount}
                        />
                        <NavButton 
                            active={activeTab === 'inventory'} 
                            onClick={() => { playSound('click'); setActiveTab('inventory'); }} 
                            icon="fa-boxes-stacked" 
                            label="庫存/商品" 
                        />
                        <NavButton 
                            active={activeTab === 'stats'} 
                            onClick={() => { playSound('click'); setActiveTab('stats'); }} 
                            icon="fa-chart-pie" 
                            label="營業統計" 
                        />
                        <NavButton 
                            active={activeTab === 'settings'} 
                            onClick={() => { playSound('click'); setActiveTab('settings'); }} 
                            icon="fa-sliders" 
                            label="系統設定" 
                        />
                    </nav>

                    {/* MODALS */}
                    {/* Checkout Modal */}
                    {checkoutModal && (
                        <CheckoutModal 
                            cart={cart}
                            cartTotal={cartTotal}
                            paymentMethods={paymentMethods}
                            payMethod={payMethod}
                            setPayMethod={setPayMethod}
                            cashReceived={cashReceived}
                            setCashReceived={setCashReceived}
                            onClose={() => setCheckoutModal(false)}
                            onConfirm={handleCompleteCheckout}
                        />
                    )}

                    {/* Success Transaction Modal */}
                    {showSuccessModal && lastTransaction && (
                        <SuccessModal 
                            transaction={lastTransaction}
                            onClose={() => setShowSuccessModal(false)}
                        />
                    )}

                    {/* Add/Edit Product Modal */}
                    {editProductModal && (
                        <EditProductModal 
                            product={editProductModal === 'new' ? null : editProductModal}
                            onClose={() => setEditProductModal(null)}
                            onSave={(savedProduct) => {
                                if (editProductModal === 'new') {
                                    setProducts([...products, { ...savedProduct, id: 'p_' + Date.now() }]);
                                } else {
                                    setProducts(products.map(p => p.id === savedProduct.id ? savedProduct : p));
                                }
                                setEditProductModal(null);
                            }}
                            onDelete={(id) => {
                                setProducts(products.filter(p => p.id !== id));
                                setEditProductModal(null);
                            }}
                        />
                    )}
                </div>
            );
        }

        // --- 1. POS Cashier View Component ---
        function PosView({ products, cart, addToCart, updateCartQty, clearCart, cartTotal, cartItemCount, openCheckout }) {
            return (
                <div className="p-4 flex flex-col gap-4 min-h-full">
                    {/* Product Grid */}
                    <div className="flex-1">
                        <div className="flex justify-between items-center mb-3">
                            <span className="text-sm font-bold text-slate-600 flex items-center gap-1">
                                <i className="fa-solid fa-store text-amber-500"></i> 點擊商品加入購物車
                            </span>
                            <span className="text-xs bg-slate-200 text-slate-700 px-2 py-1 rounded-full font-bold">
                                共 {products.length} 項商品
                            </span>
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                            {products.map(product => {
                                const inCart = cart.find(item => item.id === product.id);
                                const isSoldOut = product.stock <= 0;

                                return (
                                    <div 
                                        key={product.id}
                                        onClick={() => addToCart(product)}
                                        className={`relative rounded-2xl p-3 border-2 transition-all duration-150 bounce-active flex flex-col justify-between h-36 ${
                                            isSoldOut 
                                                ? 'bg-slate-100 border-slate-200 opacity-60 grayscale cursor-not-allowed' 
                                                : inCart 
                                                    ? 'bg-amber-50 border-amber-400 shadow-md ring-2 ring-amber-300 ring-offset-1' 
                                                    : 'bg-white border-slate-200 shadow-sm hover:border-amber-300 active:bg-amber-50'
                                        }`}
                                    >
                                        {/* Sold Out Badge */}
                                        {isSoldOut && (
                                            <div className="absolute inset-0 bg-slate-900/40 rounded-2xl backdrop-blur-[1px] flex items-center justify-center z-10">
                                                <span className="bg-rose-600 text-white font-black text-sm px-3 py-1 rounded-full shadow-lg transform -rotate-12 tracking-widest border border-white">
                                                    售罄 SOLD OUT
                                                </span>
                                            </div>
                                        )}

                                        {/* Cart Qty Badge */}
                                        {inCart && (
                                            <div className="absolute -top-2 -right-2 bg-amber-500 text-white font-black rounded-full w-7 h-7 flex items-center justify-center text-sm shadow-md border-2 border-white z-10 pop-in">
                                                {inCart.qty}
                                            </div>
                                        )}

                                        <div className="flex justify-between items-start">
                                            <div className={`w-12 h-12 rounded-xl flex items-center justify-center text-2xl shadow-inner ${product.color || 'bg-amber-100 text-amber-600'}`}>
                                                {product.icon || '🎁'}
                                            </div>
                                            <div className="text-right">
                                                <span className="text-xs font-bold text-slate-400 block">庫存</span>
                                                <span className={`text-xs font-extrabold px-1.5 py-0.5 rounded ${product.stock <= 3 ? 'bg-rose-100 text-rose-600' : 'bg-slate-100 text-slate-600'}`}>
                                                    {product.stock}
                                                </span>
                                            </div>
                                        </div>

                                        <div>
                                            <h3 className="font-bold text-slate-800 text-sm truncate leading-tight">{product.name}</h3>
                                            <p className="text-amber-600 font-black text-lg mt-0.5">
                                                ${product.price}
                                            </p>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* Floating Cart Bottom Bar */}
                    {cart.length > 0 && (
                        <div className="sticky bottom-2 bg-slate-900 text-white rounded-2xl p-3 shadow-2xl border border-slate-700 flex flex-col gap-2 pop-in z-20">
                            {/* Quick Item List */}
                            <div className="max-h-24 overflow-y-auto divide-y divide-slate-800 px-1">
                                {cart.map(item => (
                                    <div key={item.id} className="py-1.5 flex justify-between items-center text-xs">
                                        <span className="font-bold truncate max-w-[120px]">{item.product.name}</span>
                                        <div className="flex items-center gap-2">
                                            <span className="text-slate-400">${item.product.price}</span>
                                            <div className="flex items-center bg-slate-800 rounded-lg border border-slate-700">
                                                <button 
                                                    onClick={(e) => { e.stopPropagation(); updateCartQty(item.id, -1); }}
                                                    className="w-6 h-6 flex items-center justify-center text-amber-400 font-bold active:bg-slate-700 rounded-l-lg"
                                                >
                                                    -
                                                </button>
                                                <span className="w-5 text-center font-bold text-amber-300">{item.qty}</span>
                                                <button 
                                                    onClick={(e) => { e.stopPropagation(); updateCartQty(item.id, 1); }}
                                                    className="w-6 h-6 flex items-center justify-center text-amber-400 font-bold active:bg-slate-700 rounded-r-lg"
                                                >
                                                    +
                                                </button>
                                            </div>
                                            <span className="font-bold text-amber-400 w-10 text-right">${item.product.price * item.qty}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* Cart Action Footer */}
                            <div className="flex justify-between items-center pt-2 border-t border-slate-800">
                                <button 
                                    onClick={clearCart}
                                    className="text-xs text-rose-400 hover:text-rose-300 font-bold px-2 py-1 rounded bg-rose-950/50 border border-rose-800/50"
                                >
                                    清空
                                </button>

                                <div className="flex items-center gap-3">
                                    <div className="text-right">
                                        <span className="text-[10px] text-slate-400 block">共 {cartItemCount} 件</span>
                                        <span className="text-xl font-black text-amber-300">${cartTotal}</span>
                                    </div>

                                    <button 
                                        onClick={openCheckout}
                                        className="bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-slate-900 font-black px-5 py-2.5 rounded-xl text-base shadow-lg bounce-active flex items-center gap-1.5"
                                    >
                                        <span>結帳</span>
                                        <i className="fa-solid fa-arrow-right"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- 2. Inventory View Component ---
        function InventoryView({ products, setProducts, openEditModal }) {
            const handleStockAdjust = (id, delta) => {
                playSound('click');
                setProducts(products.map(p => {
                    if (p.id === id) {
                        return { ...p, stock: Math.max(0, p.stock + delta) };
                    }
                    return p;
                }));
            };

            return (
                <div className="p-4 space-y-4">
                    <div className="flex justify-between items-center">
                        <div>
                            <h2 className="text-base font-bold text-slate-800">商品與庫存管理</h2>
                            <p className="text-xs text-slate-500">在此盤點、新增或修改商品價格與數量</p>
                        </div>
                        <button 
                            onClick={() => { playSound('click'); openEditModal('new'); }}
                            className="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-3 py-2 rounded-xl text-xs flex items-center gap-1 shadow-sm bounce-active"
                        >
                            <i className="fa-solid fa-plus"></i> 新增商品
                        </button>
                    </div>

                    <div className="space-y-2.5">
                        {products.map(product => (
                            <div key={product.id} className="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm flex justify-between items-center">
                                <div className="flex items-center space-x-3">
                                    <div className={`w-11 h-11 rounded-xl flex items-center justify-center text-xl shadow-inner ${product.color || 'bg-amber-100 text-amber-600'}`}>
                                        {product.icon || '🎁'}
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-slate-800 text-sm">{product.name}</h3>
                                        <span className="text-amber-600 font-black text-sm">${product.price}</span>
                                    </div>
                                </div>

                                <div className="flex items-center space-x-3">
                                    {/* Stock Adjust Counter */}
                                    <div className="flex items-center bg-slate-100 rounded-xl p-1 border border-slate-200">
                                        <button 
                                            onClick={() => handleStockAdjust(product.id, -1)}
                                            className="w-7 h-7 bg-white rounded-lg font-black text-slate-600 shadow-sm active:bg-slate-200 flex items-center justify-center"
                                        >
                                            -
                                        </button>
                                        <span className={`w-8 text-center font-extrabold text-sm ${product.stock === 0 ? 'text-rose-600' : 'text-slate-800'}`}>
                                            {product.stock}
                                        </span>
                                        <button 
                                            onClick={() => handleStockAdjust(product.id, 1)}
                                            className="w-7 h-7 bg-white rounded-lg font-black text-slate-600 shadow-sm active:bg-slate-200 flex items-center justify-center"

                    </div>

                    {/* Top Selling Products */}
                    <div className="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-3">

        // --- 4. Settings View Component ---
        function SettingsView({ paymentMethods, setPaymentMethods, resetDemoData }) {
            const handleQRUpload = (id, event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    const base64Img = e.target.result;
                    setPaymentMethods(paymentMethods.map(m => m.id === id ? { ...m, qr: base64Img } : m));
                    playSound('add');
                };
                reader.readAsDataURL(file);
            };

            const removeQR = (id) => {
                setPaymentMethods(paymentMethods.map(m => m.id === id ? { ...m, qr: '' } : m));
            };

            return (
                <div className="p-4 space-y-4">
                    <div>
                        <h2 className="text-base font-bold text-slate-800">電子支付與系統設定</h2>

                        {paymentMethods.map(method => (
                            <div key={method.id} className="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                                <div className="flex justify-between items-center">
                                    <div className="flex items-center space-x-2">
                                        <div className={`w-8 h-8 rounded-lg flex items-center justify-center ${method.color}`}>
                                            <i className={`fa-solid ${method.icon}`}></i>
                                        </div>
                                        <span className="font-bold text-sm text-slate-800">{method.name}</span>
                                    </div>
                                    <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${method.qr ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-400'}`}>
                                        {method.qr ? '已設定收款碼' : '未上傳'}
                                    </span>
                                </div>

                                {/* QR Preview or Upload Box */}
                                {method.qr ? (
                                    <div className="flex items-center space-x-3 bg-slate-50 p-2 rounded-xl border border-slate-100">
                                        <img src={method.qr} alt={method.name} className="w-16 h-16 object-contain rounded-lg border bg-white" />
                                        <div className="flex-1">
                                            <p className="text-xs text-slate-600 font-bold">已上傳收款 Code</p>
                                            <p className="text-[10px] text-slate-400">結帳選此支付時將展示這張圖</p>

                                            onClick={() => removeQR(method.id)}
                                            className="text-xs text-rose-500 hover:text-rose-700 p-2 font-bold"
                                        >
                                            移除
                                        </button>
                                    </div>
                                ) : (
                                    <label className="block w-full border-2 border-dashed border-slate-300 hover:border-amber-400 rounded-xl p-3 text-center cursor-pointer transition-colors bg-slate-50">
                                        <i className="fa-solid fa-cloud-arrow-up text-amber-500 text-lg mb-1 block"></i>
                                        <span className="text-xs font-bold text-slate-600 block">上傳 {method.name} 收款圖片</span>
                                        <span className="text-[10px] text-slate-400 block">點擊選擇照片/拍攝相簿</span>
                                        <input 
                                            type="file" 
                                            accept="image/*" 
                                            className="hidden" 
                                            onChange={(e) => handleQRUpload(method.id, e)}
                                        />
                                    </label>
                                )}
                            </div>
                        ))}
                    </div>

                    <div className="pt-4">
                        <button 
                            onClick={resetDemoData}
                            className="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2.5 rounded-xl text-xs transition-colors"
                        >
                            <i className="fa-solid fa-rotate-left mr-1"></i> 重置所有資料與範例商品
                        </button>
                    </div>
                </div>
            );
        }

                                    <div className="flex items-center space-x-2">

                                            type="number" 
                                            value={cashReceived}
                                            onChange={(e) => setCashReceived(e.target.value)}

                                                alt={selectedEPay.name} 
                                                className="w-48 h-48 object-contain mx-auto"

                >
                    <i className={`fa-solid ${icon} text-lg mb-0.5`}></i>
                    <span className="text-[10px]">{label}</span>
                    {badge > 0 && (
                        <span className="absolute -top-1 right-2 bg-rose-500 text-white rounded-full w-4 h-4 text-[10px] flex items-center justify-center font-bold">
                            {badge}
                        </span>
                    )}
                </button>
            );
        }

        // Mount App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
